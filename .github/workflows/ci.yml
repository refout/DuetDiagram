name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: 编译 + 测试 + 契约门禁
    runs-on: ubuntu-latest
    steps:
      # lfs: true 不是可选项。冻结语料在 reports/raw/ 下走 LFS，不拉取的话
      # 检出的是指针文本，而 Corpus.Load() 见到指针会**直接抛异常**——
      # 这是有意设计的：静默跳过会让语料回归测试在别人机器上"通过"，而它什么都没验。
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DuetDiagram.slnx

      - name: Build（警告即错误）
        run: dotnet build DuetDiagram.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test（全部测试工程）
        run: |
          dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
          dotnet test --project DuetDiagram.Layout.Tests/DuetDiagram.Layout.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
          dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
          dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build
          dotnet test --project DuetDiagram.Dsl.Tests/DuetDiagram.Dsl.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build

      # P1 判据 #1：DuetDiagram.Core 仅依赖 BCL
      - name: Core 引用门禁（csproj 层）
        run: |
          if grep -qE '<(Package|Project)Reference' DuetDiagram.Core/DuetDiagram.Core.csproj; then
            echo "::error file=DuetDiagram.Core/DuetDiagram.Core.csproj::Core 不得引用任何包或项目"
            exit 1
          fi

      # P1 判据 #1：程序集引用表层（覆盖传递依赖）
      - name: Core 引用门禁（程序集层）
        run: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=CorePurity"

      # P1 判据 #12：Memento 多态注册完整
      - name: Memento 注册门禁
        run: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=MementoRegistration"

      # 命令清单与实际注册的命令逐条一致。这张表是外部代理写代码时唯一的依据，
      # 表里多一条不存在的命令、或少一条真有的命令，都不会让别的测试变红。
      - name: 命令清单门禁
        run: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=CommandGroups"

      # P1 判据 #22：LOC 一致
      - name: LOC 一致性
        run: dotnet run --project tools/LocCounter -c ${{ env.CONFIGURATION }} -- --root "$PWD" --check

      # 用户测试那四个统计量：在构造好的已知答案上算得对不对。
      # 它们决定被测手段保不保，而算错的表现在报告上完全看不出来——
      # 四个数都照常印出来，只是印错了。不需要真人数据，随时可跑。
      - name: 用户测试装置自检
        run: dotnet run --project tools/UserStudy -c ${{ env.CONFIGURATION }} -- verify

      # 任务 YAML 必须能被解析。它们是给 agent 读的，读不了等于任务不存在。
      # 已经踩过两次：一次是 expect 值里有未加引号的冒号加空格，
      # 一次是正文里有未加引号的引号。两次都是整个文件解析失败，而没有任何东西会报错。
      - name: 任务 YAML 可解析
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          broken = []
          for path in sorted(glob.glob('tasks/**/*.yaml', recursive=True)):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
              except Exception as error:
                  broken.append(f'{path}: {error}')
          if broken:
              print('\n'.join(broken))
              sys.exit(1)
          print('任务 YAML 全部可解析')
          PY

      # 布局的不变量：固定坐标精确、无残留重叠、四个方向。方案 §10 的布局判据。
      - name: 布局不变量门禁
        run: dotnet test --project DuetDiagram.Layout.Tests/DuetDiagram.Layout.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=Layout"

      # 降级的核心性质：级别唯一、固定位置保留到最后一级之前。
      - name: 降级门禁
        run: dotnet test --project DuetDiagram.Layout.Tests/DuetDiagram.Layout.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=LayoutFallback"

      # 空间索引的跨边界正确性。这一条退化的表现是「拖动时元素一半画出来一半没有」。
      - name: 视口索引门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=QuadTree"

      # 坐标换算与缩放锚点。这一条退化的表现是「点不中元素」——
      # 偏差随缩放倍数放大，在画面上完全看不出来，只能在坐标上验。
      - name: 视口变换门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=Viewport"

      # 命中测试：点中节点、点中边、点中空白、重叠时谁在上、不受视口剔除影响。
      # 这一条退化会让画布「点不中元素」，而偏差随缩放放大、画面上完全看不出来。
      - name: 命中测试门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=HitTest"

      # 剔除的判据与范围：阈值边界、预取边距、跨边界元素。
      # 判据散成两处时的表现是「有时快有时慢」，看不出规律，也就无从查起。
      - name: 剔除判据门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=CullingPolicy"

      # 换档的三帧编排：判定、预备、生效。挤在同一帧的表现是「转一下视图卡一下」，
      # 而那一帧在别处都看不出来异常。
      - name: 换档编排门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=ModeSwitch"

      # 帧时采样：环形窗口、分位数、空窗口、关着时不记。
      # 采样器分配的话，垃圾回收本身会出现在面板显示的数字里——量的是自己，
      # 而面板上那几个数字看起来完全正常。
      - name: 采样器门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=DiagnosticsSampler"

      # 变更高亮的三种手段：各自独立可辨、叠加时不互相盖住、颜色只是辅助线索。
      # 这一条退化的表现是"色觉障碍用户看到的是一张没标过的图"——
      # 只靠颜色区分的话，那一点无法事后补救。
      - name: 变更高亮门禁
        run: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=Highlight"

      # 词法层：定界符之内是自由文本。真实语料里七成以上的文件含标签内标点，
      # 按标识切会让它们全变成「不认识的东西」。
      - name: Mermaid 词法门禁
        run: dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=MermaidLexing"

      # 语法层：认不出的内容记诊断而不抛异常，图类型不是流程图时整份放弃。
      - name: Mermaid 语法门禁
        run: dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=MermaidParsing"

      # 冻结语料回归。这一道需要 LFS 真的拉下来，否则会在 Corpus.Load() 上直接失败——
      # 那是刻意的：语料缺席时"通过"等于什么都没验。
      - name: Mermaid 语料门禁
        run: dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=MermaidCorpus"

      # 剥围栏：真实语料里有三成回答把 DSL 包在 Markdown 围栏里，标签还各不相同。
      # 这一步与词法分析分开，失败时能一眼看出是哪一层的错。
      - name: DSL 词法门禁
        run: dotnet test --project DuetDiagram.Dsl.Tests/DuetDiagram.Dsl.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=DslLexing"

      # 语法层：认不出的内容记诊断而不抛异常。与 Mermaid 侧同一口径——
      # 口径不一致的话，P1-14 的对比量到的是口径差异而不是格式差异。
      - name: DSL 语法门禁
        run: dotnet test --project DuetDiagram.Dsl.Tests/DuetDiagram.Dsl.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=DslParsing"

      # c-dsl 组五十份真实回答必须全部解析干净。同样依赖 LFS。
      - name: DSL 语料门禁
        run: dotnet test --project DuetDiagram.Dsl.Tests/DuetDiagram.Dsl.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build -- --filter-trait "Category=DslCorpus"

  app-and-aot:
    name: 界面栈自检 + 端到端 + 原生发布
    # 三项都放在 Windows 上：界面自检与端到端要初始化窗口平台与绘图后端，
    # 原生链接要 MSVC 工具链，这三样只有 Windows 运行器具备。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 构建界面程序
        run: dotnet build DuetDiagram.App/DuetDiagram.App.csproj -c ${{ env.CONFIGURATION }}

      # 无头模式下起窗口、送输入、抓一帧。绘制列表对不对由快照管，
      # 这里盯的是两者在真实窗口里有没有接上。
      # 这一条同时覆盖 Canvas（缩放、平移、状态栏）、ModeSwitch
      # （换档那一帧的耗时、换档前后画布区域逐像素一致）、Diagnostics
      # （快捷键开关面板、面板上的数字跟着帧更新、面板关着时一条都不记）、
      # ErrorPresentation（错误码怎么呈现）与 LayoutFailure（布局失败之后画面与提示）。
      - name: 端到端测试
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }}

      # 诊断面板：开关走同一个入口，数字来自画布真正画了什么。
      # 面板自己读一遍文档来凑数字的话，它报的就不是屏幕上发生的事——
      # 而那种偏差在面板上完全看不出来。
      - name: 诊断面板门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=Diagnostics"

      # 属性面板：选中驱动、字段走命令层、多选统一赋值。面板自己写文档的话，
      # 「人和 LLM 能力对等」当场不成立——LLM 那边没有面板可点，那条修改就缺入口。
      # 这一条覆盖六个分节、改字段版本加一、多选「多个值」与被拒值留在字段上。
      - name: 属性面板门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=PropertyPanel"

      # 节点拖拽：拖动中不改文档、不调布局、不发命令；松手才作为一条操作落定
      # （固定位置 + 重布局）。重叠固定节点的落点被挡下。这一条覆盖无命令、
      # 只定一个、被拒、整次拖拽算一步撤销、画布预览偏移。
      - name: 节点拖拽门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=Drag"

      # 连线：从端口拖出、拖到空白取消、拖到自身被拒。这一条退化的表现是
      # 「明明从端口拖了线却连不上」，而界面上没有任何报错——端口判定错在坐标层。
      - name: 连线门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=Connect"

      # 边的编辑：端点重连、折点增删、标签编辑各发一条命令。折点若被拆成
      # 「删一条再加一条」，撤销要按两次而用户眼里是一次操作——这条验收的就是这个。
      - name: 边编辑门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=EdgeEdit"

      # 变更高亮：一条命令之后对应元素被标记，撤销之后标记继承原来源并带撤销符号。
      # 这一条退化的表现是"LLM 改的东西不亮"或"撤销之后来源丢了"——
      # 高亮若自己比较文档而不听通知，那条路径根本不经过界面。
      - name: 变更高亮门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=Highlight"

      # 高亮全开时的帧率：给一批节点挂上三种手段，判据与不带高亮时同一条。
      # 它验的是"高亮叠加层没有拖垮帧率"——混进绘制列表的几何会让每帧多算一遍，
      # 而那种开销在画面上完全看不出来。
      - name: 变更高亮帧率
        run: dotnet run --project DuetDiagram.App -c ${{ env.CONFIGURATION }} --no-build -- --benchmark-frames --nodes 1000 --frames 120 --highlight

      # 错误码到界面呈现的对照表必须覆盖全部错误码，且与文档里那张表逐行一致。
      # 漏一个就是一次没有反馈的失败——用户点了一下，什么都没发生，也没有一句话。
      # 两张表分头维护的话，外部代理照着文档写代码，实际行为却是另一套。
      - name: 错误码呈现门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=ErrorPresentation"

      # 布局全部降级失败之后：画面停在上一次成功的结果上、状态栏变红、三个选项都在。
      # 清空画面的表现是用户以为图丢了，于是他去找备份——
      # 而真正该做的是去掉那条算不出来的约束。
      - name: 布局失败门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=LayoutFailure"

      # 布局约束的界面入口：面板上能加能删，加完之后下一次布局真的按约束走。
      # 只写进文档而不重排的话，画面上什么都不会变，而用户会再点一次。
      # 另外两条：只有人工加的能删（引擎推的删了下一轮还会回来，模型提的被删掉它自己不知道），
      # 拖到兄弟节点上落定的是次序且同一主语上只留一条（追加的话求解器取的是最早那一次）。
      - name: 布局约束入口门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=ConstraintEditor"

      # 多窗口：同一进程里两个窗口看同一份文档，一边改了另一边要跟着刷新且版本不分叉。
      # 各开一份工作区的话改一边另一边不动，而用户以为在看同一份文件；
      # 只读那一份要逐个写入口都禁掉——留一个能点的按钮就是一个能造成损坏的入口。
      - name: 多窗口门禁
        run: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=MultiWindow"

      # 跨进程所有权：独占、只读退档、心跳过期判定与"抢占前先试删锁文件"。
      # 句柄是判据、心跳是补充——把心跳过期直接当成可抢占会撕掉一个活着进程正在写的文档。
      - name: 文档所有权门禁
        run: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -c ${{ env.CONFIGURATION }} -- --filter-trait "Category=DocumentLock"

      # 拖拽单帧处理耗时：一千节点上开一条拖拽、连续两百次采样每帧处理拖拽输入的中位。
      # 判据是单帧不超过 16 毫秒——这是 §14.3「拖拽延迟 < 16ms」的取证。
      - name: 拖拽帧时基准
        run: dotnet run --project DuetDiagram.App -c ${{ env.CONFIGURATION }} --no-build -- --benchmark-drag --nodes 1000 --samples 200

      # 脱屏渲染一帧后退出，用退出码表达结果；同时产出可人工核对的证据图。
      - name: 界面栈自检
        run: |
          $output = dotnet run --project DuetDiagram.App -c ${{ env.CONFIGURATION }} --no-build -- --selftest --out reports/ci-selftest.png
          $output | Write-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "reports/ci-selftest.png")) {
            Write-Error "自检没有产出位图"
            exit 1
          }
        shell: pwsh

      # 多态快照与九个集合必须在原生编译后仍能反序列化。
      # 这一步同时覆盖核心层、布局引擎与冒烟程序——
      # 而布局依赖第三方引擎，它是否原生友好**分析器看不出来**，只有真的发布一次才知道。
      # 这里失败意味着布局引擎在原生构建下不可用，那是选型层面的问题，不是配置问题。
      - name: 原生发布
        run: dotnet publish DuetDiagram.AotSmokeTest/DuetDiagram.AotSmokeTest.csproj -c ${{ env.CONFIGURATION }}

      - name: 运行原生冒烟程序
        run: |
          $exe = "DuetDiagram.AotSmokeTest/bin/Release/net10.0/win-x64/DuetDiagram.AotSmokeTest.exe"
          $output = & $exe
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch "AOT smoke test: PASS") {
            Write-Error "冒烟程序未报告通过"
            exit 1
          }
        shell: pwsh

      # 界面程序的原生发布：这是技术选型能否成立的关键一项，由带 C++ 工具链的运行器负责。
      - name: 原生发布界面程序
        run: dotnet publish DuetDiagram.App/DuetDiagram.App.csproj -c ${{ env.CONFIGURATION }}
