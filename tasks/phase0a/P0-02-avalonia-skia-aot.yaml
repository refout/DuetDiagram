  - 不得把 Avalonia 引用扩散到 DuetDiagram.Core（P1 判据 #1）
context:
  - 方案 §2 技术选型
  - 方案 §10 性能目标（冷启动 ≤ 基线 × 1.2 且 ≤ 2s）
  - docs/Architecture.md「构建环境要求」（原生链接需要 MSVC C++ 工作负载）
risk:
