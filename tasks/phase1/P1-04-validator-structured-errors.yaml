id: P1-04
title: 校验器与结构化错误
phase: 1
status: done
depends_on: [P1-01]
estimated_loc: 300
files:
  create:
    - DuetDiagram.Core/Model/ValidationIssue.cs
  modify:
    - DuetDiagram.Core/Model/DiagramValidator.cs
    - DuetDiagram.Core/Commands/ErrorCodes.cs
    - docs/Error-Codes.md
  test:
    - DuetDiagram.Core.Tests/ValidatorTests.cs
    - DuetDiagram.Core.Tests/IrFixtures.cs
acceptance:
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=IrValidator"
    expect: 全通过
  - command: 断言每条校验问题都带修复建议
    expect: 全通过
constraints:
  - 校验只报告不修改，处置方式由调用方决定
  - 错误码必须取自 ErrorCodes 常量，不得在调用处写裸字符串
  - 每条问题都必须给出修复建议
context:
  - 命令层在写入前挡住大部分非法状态，但加载外部文件与接收同步结果不经过命令层
  - 方案要求校验工具返回「结构化错误 + 修复建议」
result:
  verdict: 完成
  delivered:
    codes: 补齐校验器需要的五个码，与既有码共用同一张表
    checks: 标识唯一、边两端、端口、成员归属、父级、成环、标签与动作引用
    suggestions: 每条问题都带一句可怎么修的建议
    layering: 校验结果与线上形状分成两个类型，提供单向转换
  fixed:
    code_drift: P1-01 里自造的码名与既有 ErrorCodes 冲突（自造了 ID_DUPLICATE、EDGE_TO_MISSING 等），本次全部对齐；测试也改为引用常量而非裸字符串
    group_cycle: 成环检查原本缺失
    layout_hint_references: |
      **2026-09-21 补：四类布局约束引用的节点与出边现在也查了。**

      原先完全没校验过：约束指向一个不存在的节点时不会有任何报错，布局层把它当作
      "没有这条约束"忽略掉，症状是"布局没按我写的来"——而用户无从知道是那个名字写错了。
      P1-17 的映射层靠"补节点"挡住了绝大多数，但那是映射层的兜，根子在这里。

      两个新码，因为要修的处置不同：

      - `LAYOUT_NODE_MISSING`：四类约束引用的节点不存在。
      - `LAYOUT_ORDER_EDGE_MISSING`：层内次序引用的边不存在，**或者不是主语节点的出边**。
        后者更隐蔽——约束照样生效，只是排的不是它想排的那些。

      组合内部的布局提示（`LocalLayout`）用同一套判据，文案里带上组合标识，
      否则用户看到一条约束报错却不知道是文档级那条还是某个分组里那条。

      落地的同时验证了一件事：DSL 与 Mermaid 的全部语料产物仍然零问题，
      说明映射层产出的引用本来就是实的，新校验没有误报。
  findings:
    cycle_reporting: 环上的每一个组合都报一条，界面按标识高亮时才能把整个环标出来；只报一个用户还得自己顺着找
    both_ends: 边的两端各自报一条，只报一条的话修完一头才会发现另一头也有问题
    suggestion_needed: 只说哪里错不说怎么改，等于把问题原样丢回给用户；对模型尤其如此，只会收到「标识重复」的模型只能猜
  deferred:
    # 原先还记着一条「布局提示里引用的节点与出边没有校验」，2026-09-21 补上了，
    # 见 result.fixed.layout_hint_references。
    - 修复建议目前是给人看的一句话，不是可直接执行的修补指令；做成机器可执行的形态要等校验工具对外暴露时再定
