estimated_loc: 500
files:
  create:
    - DuetDiagram.Mermaid/DuetDiagram.Mermaid.csproj
    - DuetDiagram.Mermaid/Lexing/MermaidToken.cs
    - DuetDiagram.Mermaid/Lexing/MermaidLexer.cs
    - DuetDiagram.Mermaid/Lexing/MermaidSource.cs
