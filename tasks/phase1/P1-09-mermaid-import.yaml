id: P1-09
title: Mermaid 导入：抽象语法树到 IR 的映射与宽松模式
phase: 1
status: done
depends_on: [P1-08]
estimated_loc: 350
files:
  create:
    - DuetDiagram.Mermaid/Import/MermaidImporter.cs
    - DuetDiagram.Mermaid/Import/ImportOptions.cs
    - DuetDiagram.Mermaid/Import/ImportReport.cs
    - DuetDiagram.Mermaid.Tests/ImporterTests.cs
    - DuetDiagram.Mermaid.Tests/CorpusImportTests.cs
    - DuetDiagram.Benchmarks/MermaidBenchmarks.cs
  modify:
    - AGENTS.md
    - tasks/phase1/P1-10-mermaid-export.yaml
acceptance:
  - command: dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -- --filter-trait "Category=MermaidImport"
    expect: 全通过
  - command: dotnet test --project DuetDiagram.Mermaid.Tests/DuetDiagram.Mermaid.Tests.csproj -- --filter-trait "Category=MermaidCorpus"
    expect: 全通过；97 份流程图全部导入，无致命失败
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=IrValidator"
    expect: 导入产物通过 DiagramValidator 且零问题
  - command: dotnet run --project DuetDiagram.Benchmarks -c Release -- --filter "*Mermaid*" --job medium
    expect: 1000 节点导入（词法 + 语法 + 映射）< 500ms，数字记进 reports/
constraints:
  - 导入产物必须通过 DiagramValidator 零问题。校验器的注释写明它就是给「不经过命令层的外部输入」准备的，导入正是那个场景——命令层的防线在这里一点都用不上
  - Mermaid 工程不得获得对文档的可变访问。Core 的 MutableNodes 等是 internal，导入只能走公开路径
  - 标识在九个集合之间共用命名空间，节点与复合节点不能同名
  - 子图映射为 CompositeDef 的派生类型。成员关系以 CompositeDef.members 为准，
    NodeDef.parent 与 CompositeDef.parent 都是冗余索引，三者必须一致（见 docs/IR-Schema.md）
  - "**members 里既有节点也有子组合**，且引用不带类型前缀：校验器先按节点解析成员，
    解析不到再按组合解析。嵌套子图因此要作为成员写进外层组合的 members，而不是只靠 parent"
  - 导入产出新的文档实例，不就地修改已有文档（约定 11：打开新文档必须新建 DiagramDocument + DiagramCommandBus）
  - 认不出来的内容进导入报告，不抛异常——这是 P1-08 已经定下的口径，导入层要接着走
context:
  - docs/IR-Schema.md
  - docs/Error-Codes.md
  - DuetDiagram.Core/Model/DiagramValidator.cs
  - tasks/phase1/P1-08-mermaid-lexing-parsing.yaml
  - reports/raw/README.md
scope_note: |
  方案里这一条叫「Mermaid 宽松模式」，250 行，依赖 P1-08。但方案的 Phase 1 清单里
  **没有单独列「语法树到 IR 的映射」这一步**，而 P1-08 只做到抽象语法树为止。
  映射不写，导入这条线就没有产出物，P1-10 也没有东西可导出。

  因此本任务 = 映射 + 宽松模式，估行相应上调。这不是范围蔓延，是把方案漏掉的一步补回它该在的位置。
result:
  verdict: 一百份语料里的 97 份流程图全部导入，产物通过 DiagramValidator 零问题
  delivered:
    nodes: 显示文本省略时回退到标识；形状直传；所属子图作为父级
    links: 生成标识（Mermaid 的连线没有标识，而 IR 的边必须有）；与缺省相同的线型与箭头不写出来
    subgraphs: 落成 GroupDef，成员按父级重推且**含嵌套子图**——语法树的成员表里只有节点，
      照抄会让外层组合的成员表与父级字段对不上
    composite_endpoints: 与子图同名的节点声明被丢掉，标识让给子图，并记进报告
    styles: style 与 classDef/class 落成具体颜色的 NodeStyle（填充、描边、文字色、描边粗细）
    report: Diagnostics / DroppedNodes / IgnoredStyleProperties 三份列表，各有出处
    tests: "MermaidImport 27、语料导入 5；Mermaid 合计 136"
  design_decisions:
    groups_win_over_nodes: 子图被当成连线端点时，节点那一份丢掉而不是改名——那份节点是解析器
      顺手造出来的，不是用户写的声明，而 Mermaid 渲染的就是两个子图框之间的连线
    classes_are_two_pass: 先收全部类定义再套用。Mermaid 要求先定义后套用，但两趟没有代价，
      而一趟时"先套用后定义"会静默丢掉样式
    member_order: 先节点、后嵌套分组，与 DSL 侧同一条规则，两边的产物才可比
  findings:
    - id: corpus-count
      what: |
        一百份语料里 97 份是流程图，另外 3 份图类型不对（都是 a-bare 组）。
        这个数是从产物里数出来的，不是假设的——用例把它钉住了，
        对不上说明有流程图被误判，或者反过来。
    - id: no-implicit-node-creation-needed
      what: |
        导入层**没有**补隐式节点，因为它依赖"解析器读到连线时会顺手给两端各造一个节点"。
        那条性质属于 P1-08，将来可能变。
      mitigation: |
        有一条用例逐份检查每条边的两端都有落点。将来那条性质变了，它会直接报出是哪个端点没落地，
        而不是让边悄悄地少一条——少一条线不容易被归因到解析器改了行为。
open_questions:
  - id: subgraph-as-endpoint
    question: 子图被当作连线端点时怎么映射？
    detail: |
      分层架构图里 `ODS --> DWD` 是拿子图当端点用的，Mermaid 允许，冻结语料里七份文件如此
      （见 P1-08 的 findings 与 CorpusParsingTests）。IR 现在表达不了这件事，
      而两条显而易见的退路都被已有不变量堵死：

        1. 边端点必须是节点——DiagramValidator.CheckEdgeEndpoints 用 FindNode 判定，
           指向复合节点会报 EDGE_SOURCE_MISSING。
        2. 九个集合共用标识命名空间，同一个标识不能既是节点又是复合节点，
           所以"同时建同名节点与复合节点"会报重复标识。

    options:
      - 给复合节点建一个代表节点作为边端点。图上会多出一个方块，需要决定它长什么样
      - 丢掉这条边，在导入报告里如实记成「表达不了」。信息丢失但不污染图
      - 放宽 IR：允许边端点是复合节点。**线格式不用改**——EdgeDef.from/to 本来就是
        字符串，成员的引用也不带类型前缀，所以数据层已经容得下它。要改的是校验器的
        端点解析（CheckEdgeEndpoints 现在只用 FindNode）与布局把端点落到组合边界上。
        比看上去便宜，但它是 IR 契约变更，仍应显式决定
    recommendation: |
      这是 IR 契约问题，不该在导入层猜。建议先做决定再写映射，
      否则这七份文件会以某种「看起来导入成功了」的方式坏掉——而那种坏法最难发现。
    status: resolved
    resolution: |
      **选第三条：放宽 IR，允许边的端点是复合节点。** 2026-09-21 定。
      线格式不用改（EdgeDef.from/to 本来就是字符串，成员引用不带类型前缀），要改的是：
      - `DiagramValidator.CheckEdgeEndpoints`：现在是两步解析模式的先例已经有了
        （`CheckCompositeMembership` 先按节点解析、解析不到再按组合解析），照它写
      - `CheckPort`：端点是复合节点时报错——端口只属于节点
      - 加 `FindComposite`（`DiagramDocument` 现在只有 `FindNode`）
      - `docs/IR-Schema.md` 登记端点约定
      **布局那半做不了，要单列。** `LayoutRequestFactory.FromDocument` 只映射 Nodes 与 Edges，
      `Composites` 被整个忽略，`LayoutNode.Parent` 只是透传——"把端点落到组合边界上"没有落点。
      在那之前，布局遇到组合端点必须在降级报告里如实记录，**不许静默丢边**。
    evidence: |
      冻结语料里 **7 份** Mermaid 文件这么写（`a-bare` 3 份、`b-documented` 4 份，
      见 `reports/compare-blind/parse-report.md` 的"端点是分组的边"一列）。
      `ODS -- "清洗" --> DWD` 是 Mermaid 表达"这一层流向那一层"的常见写法，
      而 IR 现在会报 EDGE_SOURCE_MISSING。

      那一列一共数出 8 条，多出来的一条在 `c-dsl`，**不是子图端点**：模型把泳道与
      其中一个节点都叫 `pay`，而那一列的判据只是"端点标识与某个分组标识相同"。
      它属 P1-17 的 `group-and-node-share-a-name`。本任务只认那 7 条。
  - id: pipe-label-quotes
    question: 竖线定界的边标签要不要剥外层引号？
    detail: |
      模型会写 `idem -->|"已处理"| ackSkip`，解析出来的标签原样是 `"已处理"`（带引号）。
      同一个解析器对同一件事有两种做法：方括号里的节点标签走 `Unquote`
      （`MermaidParser.cs:287`、`:534`），竖线里的边标签不走（`:582`）。

      **先要查证真实 Mermaid 的行为**：`-->|"text"|` 渲染出来带不带引号。
      带的话就该改语法参考（不该教模型这么写），不带的话就该在 `:582` 补 `Unquote`。
      两种改法都便宜，但选错会让导入结果和真实渲染不一致。
    evidence: 冻结语料里命中 2 份，都在 `b-documented`（见 `reports/compare-blind/checkability.md`）
    status: resolved
    resolution: |
      **引号是定界符，Mermaid 渲染时剥掉。所以在解析器里补 `Unquote`。** 2026-09-21 定，已落地。

      查证方式是读 Mermaid 自己的语法文件，不靠猜：

        <string>[^"]+   { return "STR"; }     ← 引号之间的内容作为 STR 返回，不含引号
        <string>["]     this.popState();
        <*>["]          this.pushState("string");

      而 text 状态里的 TEXT 记号明确排除了引号（`[^\[\]\(\)\{\}\|"]+`），
      所以 `|"已处理"|` 一定走字符串状态。边标签的语法 `PIPE text PIPE` 直接接受 `STR`。

      - 两种写法同一个机制，所以两处都剥：竖线定界那处，以及 `A -- "已处理" --> B` 那处。
      - 只剥最外层一对。标签里本来就有引号时，多剥会改掉用户的文字。
      - 语法参考不动：含逗号、括号这类会打断语法的字符时，引号**必须**加。
  - id: version-and-hash
    question: 导入产出的文档，版本号与哈希怎么定？
    detail: |
      公开的构造路径只有两条：新建空文档，以及 [JsonConstructor]（吃全部集合）。
      后者要求把版本号与哈希一并传入，但哈希要先有文档实例才能算，
      而哈希的 setter 是 internal——外部算得出、赋不进去。
      可行的绕法是构造两次（先算哈希、再传进去重建），但那样每次导入要建两个实例。
      是否值得在 Core 加一个「按内容新建并算好哈希」的入口，需要判断。
    status: resolved
    resolution: |
      **在 Core 加公开工厂 `DiagramDocument.CreateFromContent(...)`。** 2026-09-21 定，
      已落地（commit 895b0d7），P1-09 直接用。

      - 一条入口替掉两趟构造：建实例 → 算哈希 → 填版本，一次成型。
        哈希不覆盖自身，所以一趟就够，不必先造草稿。
      - 版本号固定为 0：版本号是变更计数，构造不是变更。
      - 只造新实例，不提供改已有文档的路——哈希的计算权仍然只有命令总线与这里。
      - 不做标识唯一性检查：重复标识是可诊断的（DUPLICATE_ID），不是构造错误。
        在那里抛异常会让「造一份带重复标识的文档去测校验器」做不到，
        也会与反序列化路径不一致。
      - 详见 docs/IR-Schema.md 的「构造入口」。
  - id: raw-fragment-home
    question: 未映射的原始片段保留在哪里？
    detail: |
      方案的风险缓解写着「宽松模式 + 原始片段保留」，但没说保留在哪，
      而这件事直接决定 P1-10 的往返能不能还原。
      NodeDef.meta 是 IReadOnlyDictionary<string,string> 且不计入哈希，形状上合适；
      但它挂在节点上，而原始片段可能属于整份文档、某条指令或某个子图。
      需要先定下存放位置与键名约定，并在 docs/IR-Schema.md 里登记。
    status: resolved
    resolution: |
      **不保留原始片段，只进导入报告。** 2026-09-21 定（这是对方案风险表的偏离，
      已记进 AGENTS.md 的「与方案的已知差异」表）。

      理由是原始片段有个错误模式：**它只在元素未被改动时有效**。
      用户或模型改过那个节点之后，片段就成了旧文本，而导出时再吐出来会把旧内容复活。
      放进不计哈希的 NodeDef.meta 会掩盖这个问题——两个哈希都没变，
      导出的文本却错了，而那种错没有任何地方会报。

      于是：

      - 认不出的内容（`linkStyle`、`click`、认不出的样式属性）进
        `MermaidImportReport`，并如实说明"这一条不会被导出"。
      - P1-10 的往返口径按「同一份 IR 走一圈还是同一份 IR」，
        **不是文本逐字节一致**。P1-10 的那条约束已相应改写。
      - 代价是导入→导出之后 `linkStyle` 这类东西找不回来。这是明说的损失，
        不是悄悄丢的——报告里有一条记录，用户能看到。
