estimated_loc: 400
files:
  create:
    - DuetDiagram.Layout/DuetDiagram.Layout.csproj
    - DuetDiagram.Layout/LayoutModels.cs
    - DuetDiagram.Layout/LayoutResult.cs
    - DuetDiagram.Layout/LayoutRequestFactory.cs
    - DuetDiagram.Layout/ConstraintLayoutEngine.cs
