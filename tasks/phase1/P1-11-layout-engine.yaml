result:
  verdict: 完成
  delivered:
    project: 新建布局工程，引用 Core 与第三方引擎
    input_output: 输入输出分成两组类型，输入没有坐标、输出一定有
    pipeline: 收缩、引擎、展开、回填、让位、折线重算六步
    ports: 端口接到路由，端点落在端口上
    adapter: 从文档造布局输入，尺寸由调用方测量
    diagnostics: 分阶段计时，并给出是否满足全部硬保证的判据
  design_decisions:
    separate_project: Core 只依赖基础类库，而布局要依赖第三方引擎，因此只能是 Core 之外的第一块
    two_type_sets: 输入输出合成一个类型的话，输入上会挂着一对无意义的坐标，忘了初始化就变成「读取上次残留的位置」
    measure_from_caller: 尺寸取决于字体、字号与文本长度，布局不自己猜
    no_owner_filter: 归属方决定的是冲突时听谁的，而冲突已在进布局之前处理掉
    reflow_gap_shared: 让位用的间距必须与收缩申报超节点尺寸时的那个值相同
  fixed:
    hardcoded_gap: 收缩按配置间距预留组内空间，让位却用硬编码间距；两者相等纯属巧合（缺省值刚好相同），一旦不一致同层组成员会被推出自己预留的空间
    missing_member: 同层组展开时遇到已删除的成员会抛异常，改为跳过
  findings:
    port_limitation: 端口已接入路由，但端口所在边若背对目标，折线会绕得难看。真正的端口感知布线要按端口方向规划通道，那是独立的一块工作
    poc_retired: 验证脚手架已删除。留着两份实现迟早会分叉，分叉之后测试仍然全绿而那两份已经不反映真实行为
  not_verified:
    - 降级与路径预算属 P1-12
    - 组合的层级布局尚未实现，父子关系只做透传
    - 端口感知的通道规划未做
open_questions:
  - id: composite-endpoint
    question: 端点落在组合上的边，布局怎么画？
    detail: |
      IR 已经允许边的端点是组合（见 P1-09 的 `subgraph-as-endpoint`，2026-09-21 定的），
      而布局层还不认识组合：`LayoutRequestFactory.FromDocument` 只把 `Nodes` 映射成
      `LayoutNode`，`Composites` 整个被忽略。于是这种边走到 `EdgeRouter` 的
      "输入引用了不存在的节点"分支，**边画不出来**。

      后果是**一份校验通过的文档，布局仍会报硬保证不满足**：
      `EndpointFailures` 加一，而 `SatisfiesHardGuarantees` 要求它为零。
      那条注释写着"这一项必须为零"，现在有了例外，注释与判据都要跟着改。

      要做的：把组合端点落到组合的包围盒边界上。折线重算已经在节点坐标之上工作，
      组合的包围盒由成员算得出来，所以真正要加的是"端点解析多一层"，
      与 Core 侧校验器同一口径（先节点、后组合）。

      附带要把 `EndpointFailures` 拆开——它现在把"端点没落在边界上"与
      "端点根本解析不出来"算在同一项里，两件事的处置完全不同。
    blocked_on: 排期
    status: open
  - id: order-is-not-in-the-hash
    question: 节点顺序变了，结构哈希为什么不变？
    detail: |
      结构哈希按标识排序之后算，所以集合顺序完全不进哈希。而本仓明确写着
      节点在集合中的位置是**层内次序的依据**——也就是说顺序会影响布局结果。

      于是"哈希没变"不等于"现有坐标仍然有效"：只把节点调个次序，哈希同一份，
      宿主据此判定不用重排，而实际布局结果会变。

      2026-09-21 在 P1-10 的往返里撞到的。当时的表现是导出再导入之后节点顺序挪了一处
      （Mermaid 把声明位置与归属块绑在一起），而两条哈希一模一样——
      如果没有"内容逐字段相等"那条更严的判据，这次漂移会被哈希判成"没变"。

      两边的说法各自有道理，要定的是哪一边让：
        - 哈希纳入顺序：撤销重做如果改变了插入次序，哈希就会变，从而触发一次多余的重排。
          当初排序的理由正是这个。
        - 顺序不进哈希：那"要不要重排"的判据就得由别的东西补上，或者承认这条哈希
          回答的不是它声称的问题。
      另一个可能的方向是：层内次序本来就不该由集合位置决定，而该由 `order` 约束表达——
      那样集合顺序只是构造过程的一部分，不进哈希也就说得通。
    blocked_on: 排期
    status: open
