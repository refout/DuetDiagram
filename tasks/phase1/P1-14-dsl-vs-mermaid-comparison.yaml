id: P1-14
title: DSL 与 Mermaid 对比评分
phase: 1
status: pending
depends_on: [P0-08, P1-09, P1-10, P1-16, P1-17]
estimated_loc: 400
files:
  create:
    - tools/CompareHarness/（装置，不进 sln）
    - reports/compare-blind/（盲评清单与各项证据，生成物）
  modify:
    - AGENTS.md
