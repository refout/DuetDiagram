constraints:
  - "**C 与 B 比，不与 A 比。** A 是基线，B 是「Mermaid 加等量文档」的对照组。用 A 与 C 比会把「有文档」的效果算成 DSL 的效果——这是本次实验最容易犯也最致命的错"
  - 解析失败计入分母且**必然不通过**，不能从分母里剔除
  - 移动节点位置与整体重排一律计 0 步。位置由布局引擎负责，算进人工修正会让所有格式一起变差，掩盖真正的差别
  - 分组增删计 2 步（建组 1、归入成员 1）。粒度不定死，两个人能数出一倍差距
  - 差距落在噪声范围内时（两组各 50 条，小于 2 条）**即使达标也判为不达标**。50 条样本量撑不起 3 个百分点的差距
  - 语料已冻结，不得重新生成。重新生成会让三组不再同时同模型状态，对照失效
  - 双盲靠「结构清单」而不是隐藏文本：评分者看节点列表（标识、标签、形状）与边列表（起点、终点、标签），看不出格式
context:
  - docs/Compare-Criteria.md（四个指标的计算口径与判定规则，本任务的实现依据）
  - docs/DSL-Syntax.md
  - reports/raw/README.md
