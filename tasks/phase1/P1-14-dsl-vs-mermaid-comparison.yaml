    剩下的全是人工活：填 60 份抽样评分，然后才是全量判定。

    落地位置与上面 files 一节写的不一样：装置在 `tools/CompareHarness`（不进 sln），
    没有建 `DuetDiagram.Compare.Tests`。理由与 tools/ 下其它几个一样——
