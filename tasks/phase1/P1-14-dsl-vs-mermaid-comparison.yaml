acceptance:
  # 装置不进 sln（理由见 progress.note），所以这里不是 dotnet test，
  # 而是那几个命令自己。verify 是唯一不需要语料、可以随时进 CI 的一个。
  - command: dotnet run --project tools/CompareHarness -c Release -- verify
    expect: 全部通过；谓词求值器自检 + 50 条提示词的 253 个谓词全部读得进来
  - command: dotnet run --project tools/CompareHarness -c Release -- listings
    expect: 退出码 0；三组各 50 条的四种解析结局分开报出
  - command: dotnet run --project tools/CompareHarness -c Release -- semantic
    expect: 退出码 0；语义拒绝率按组给出，解析整份放弃的那些单列
  - command: dotnet run --project tools/CompareHarness -c Release -- score
    expect: 退出码 0；谓词口径的三组数字，且报告开头写明它不能当判定门的答案
  - command: dotnet run --project tools/CompareHarness -c Release -- sample
    expect: 退出码 0；60 份清单 + 空白评分模板，每组的分层构成一并打印
  - command: dotnet run --project tools/CompareHarness -c Release -- agreement
    expect: 有人工评分时算出一致率并列出分歧；没有评分文件时明确报"还没人交评分"而不是算出一个空数
  - command: dotnet run --project tools/LocCounter -c Release -- --root . --check
    expect: 一致
constraints:
  - "**C 与 B 比，不与 A 比。** A 是基线，B 是「Mermaid 加等量文档」的对照组。用 A 与 C 比会把「有文档」的效果算成 DSL 的效果——这是本次实验最容易犯也最致命的错"
  - 解析失败计入分母且**必然不通过**，不能从分母里剔除
  - 移动节点位置与整体重排一律计 0 步。位置由布局引擎负责，算进人工修正会让所有格式一起变差，掩盖真正的差别
  - 分组增删计 2 步（建组 1、归入成员 1）。粒度不定死，两个人能数出一倍差距
  - 差距落在噪声范围内时（两组各 50 条，小于 2 条）**即使达标也判为不达标**。50 条样本量撑不起 3 个百分点的差距
  - 语料已冻结，不得重新生成。重新生成会让三组不再同时同模型状态，对照失效
  - 双盲靠「结构清单」而不是隐藏文本：评分者看节点列表（标识、标签、形状）与边列表（起点、终点、标签），看不出格式
context:
  - docs/Compare-Criteria.md（四个指标的计算口径与判定规则，本任务的实现依据）
  - docs/DSL-Syntax.md
  - reports/raw/README.md
  - tasks/phase0a/P0-08-llm-corpus-generation.yaml（语料的生成记录与已知局限）
  - tasks/phase1/P1-09-mermaid-import.yaml
scope_note: |
  **这个任务有一半不是编码 agent 能做的。**

  四个指标里只有「解析错误率」可以自动算——它的判定者是自动的，不需要人。
  另外三个（端到端准确率、人工修正步骤、首轮通过率）按 docs/Compare-Criteria.md
  的设计**需要两名受过培训的评分者各自独立评 150 份**，再算一致性。

  所以本任务的交付物是**装置**：把可自动算的算出来、把要人评的整理成盲评清单、
  把人工评分汇总成四个指标与判定结论。**结论本身（决策门 1）由人填。**

  一个编码 agent 声称「已跑完对比并得出 DSL 应当保留」时，它几乎一定只是算了
  解析错误率那一项，然后把结论替人写了。任务验收里没有「得出保留 DSL 的结论」
  这一条，是刻意的。

  另：方案的依赖写的是 P1-08/10/16/17。这里改成 P1-09/10/16/17——
  解析错误率要区分「语法拒绝」与「语义拒绝」，而语义拒绝要过 IR 与校验器，
  只到语法树（P1-08）算不出来。P1-10 保留是因为 B 组是 Mermaid，
  结构清单要能从中还原出节点与边。
progress:
  updated_at: 2026-09-21
  note: |
    **装置这一半齐了，结论那一半没做，这是刻意的。**
