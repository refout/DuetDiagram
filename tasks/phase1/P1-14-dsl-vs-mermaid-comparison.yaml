    - 决策门 1 的结论
  findings:
    checkability: |
      检查项判不了机器。子串命中约 60%，最松的确定匹配（子序列）约 75%，
      三组分别是 75.5% / 69.1% / 75.5%。剩下那 25% 是措辞差异而不是模型没做到，
      且三组少给分的比例不一样——差出来的部分会被算成格式的差别。
      再松就要引入相似度阈值，而阈值取多少没有客观依据，判定门要的差别正好是十几个百分点。
      要改的是检查项的写法（显式谓词 + 同义词表），不是评分程序。
    blinding_leaks: |
      只投影到节点与边还不够，清单里另有两处自报组别，实测后整批抹平：
      标识写法（c-dsl 43 个带连字符、b-documented 零个；反向 B 有 11 个下划线与 14 个全大写、
      C 两样都是零）与标签里的 <br>（A 13 个、B 8 个、C 零个）。
      标识整批换成流水号，换行标记换成空格。
    wrong_diagram_kind: |
      不给文档时模型会挑错图类型：a-bare 组 50 份里有 3 份是 sequenceDiagram 或 stateDiagram-v2。
      这一项在 B 与 C 上完全相同，**恰好证明三组设计是必要的**——
      拿 A 与 C 比会把"有文档"的功劳记到 DSL 头上。
    self_scoring_is_not_evidence: |
      模拟评分做了三分之一（50/150），C 组端到端 78.6%、B 组 84.6%，没有信号。
      决定不继续：评的人知道哪份是哪组（key 是装置自己生成的），
      且逐批严格度漂移会伪装成组间差异。**把三分之一的猜测补成三分之三的猜测不会让它变成证据。**
    predicate_saturation: |
      谓词口径的端到端准确率是 a-bare 88.0%、b-documented 100.0%、c-dsl 98.0%。
      253 项里只有 23 项在三组 150 份上不是全过，其余 230 项没有区分任何东西。
      原因不是谓词写坏了：检查项绝大多数是存在性断言，而给足语法文档之后这类断言基本都成立。
      **存在性断言天然分不出"写对了"与"写得刚刚好"。**

      直接后果：判定门第一条（C 比 B 高 15 个百分点）在谓词口径下不可能达成——
      对照组已经在天花板上。**这不是 C 不好的证据，是口径到顶了。**
      谓词口径的那份数字因此改定位为回归网，不作结论用。
    listing_id_collision: |
      投影出的结构清单里出现过一次标识重号：c-dsl 的 C02，节点与泳道都叫 `pay`
      （模型把泳道名当成了节点名）。清单的匿名化按原标识记流水号，
      同一个标识出现在两处时会被编成同一个号，于是清单里一个标识既是节点又是分组。
      求值器按"先节点、后分组"解析端点，重号会让它把节点当成分组，**静默给出错的结果**。

      已修：匿名化改成节点与分组各一张表，引用按"先节点、后分组"解析——
      与映射层遇到撞名时的取舍一致（保持原标识的是节点，被改名的才是容器，
      见 semantic-report.md 里"c-dsl 改名 1 个容器"那一行）。
      150 份里现在零重号。

      同一件事还暴露了求值器的另一处：`IsDescendant` 只查节点的父级表，
      嵌套分组永远查不到祖先，于是 groupMembers 的 memberGroups 分支恒不成立。
      也已修，并进了 Verify.cs 的自检。
    predicate_failures_are_rare: |
      抽样时量了一遍「谓词判不通过」的条目有多少：**150 份里只有 4 份**
      （a-bare 3、c-dsl 1、b-documented 0），其余 146 份三组谓词全过。
      这是 predicate_saturation 的另一面：不只是"三组之间没有差别"，
      而是"几乎没有任何一份被谓词判过不通过"。

      对抽样设计有直接影响：分层只能多收 4 份，其余 56 份按固定顺序补。
      另：a-bare 那 3 份之外还有 3 份解析失败，最初的分层把它们也当成了
      "判不通过"优先收。那是错的——解析失败的谓词必然判不通过，人看一眼也会说不通过，
      两边永远一致，收进来只挤掉真正有分歧的条目。已改成只收「解析成功且判不通过」的。
  registered_elsewhere:
    - 竖线边标签不剥引号、边指向分组 → P1-09（都已在 P1-09 / P1-10 里处置）
open_questions:
  - id: who-scores
    question: 两名评分者是谁，评分怎么落盘？
    detail: |
      docs/Compare-Criteria.md 规定了「两名评分者各自独立评全部 150 份」与培训流程，
      但没说评分结果存在哪、由谁触发汇总。需要一个明确的评分文件格式
      （每条 prompt × 每个检查项 × 两名评分者）与存放位置，否则汇总算不出来。
      建议放在 reports/ 下与盲评清单同目录，且**不进版本库**——
      评分是人的工作产物，混进仓库会让「语料冻结」这件事变得模糊。
    status: resolved
    resolution: |
      **2026-09-21 定了，分两步走，第一步是校准而不是判定。**

      先校准。谓词是拿 150 份语料对着调出来的，还没跟人核过（见
      open_questions.checks-not-machine-checkable）。全量 150 份 × 逐项 × 两人
      的量太大，而校准只需要发现"谓词哪里写错了"，不需要对每一份都下结论。
      所以先抽 60 份（每组 20）逐项判，算谓词与人的一致率。

      校准通过之后才轮到判定。那时检查项可以交给机器，人只需要给
      「修正步数」与「多出来的东西」——这两项谓词判不了，也正是判定门里
      首轮通过率与人工修正步骤要的两个数。全量人工成本因此从"每份逐项判五条"
      降到"每份填一个步数"。**这不是把判定门那一步省掉，是把它前面的判据先落实。**

      **落盘格式与位置：**
      - 目录 `reports/compare-blind/human/`，**整目录不进版本库**。
      - 文件名 `ratings-<评分者>.json`。
      - 键是抽样清单上的编号；值是 `{ "checks": [1,0,null,…], "steps": 0, "extra": "" }`。
        `checks` 逐项填 1（通过）/0（不通过）/null（未判），`steps` 是人工修正步数，
        `extra` 写多出来的东西。
      - 文件里的 `sample` 字段记抽样清单的指纹，对不上就报错不干活——
        编号指的是不同的条目时，按序号对齐会把判定安到错的话上，而算出来的数字看起来正常。
      - 格式只认严的：编号不认识、项数对不上、值不是 0/1/null，一律报错并指出位置。
        放过去的代价是那几项从分母里静默消失。

      **工具：** `sample` 生成清单与空白模板，`agreement` 读评分文件算一致率并列出分歧。
      抽样的分层口径是「谓词判不通过、且解析成功的优先收」；解析失败的排除在优先层之外，
      它们的谓词必然判不通过，人看一眼也会说不通过，两边永远一致，问不出谓词错在哪。
      汇总结论 `agreement.md` 进版本库，里面记着每份评分文件的指纹。

      **状态：装置已落地，人工评分还没收，所以 `agreement.md` 还不存在。**
      先放一份假报告进去只会被后来的读者当成真数据。
    evidence: |
      tools/CompareHarness/Sample.cs、Ratings.cs、Agreement.cs；
      reports/compare-blind/sample-rater.md（60 份清单，不进版本库）；
      reports/compare-blind/README.md（工作流程与文件去向）
  - id: checks-not-machine-checkable
    question: 要不要把 256 个检查项改写成可判定的形式？
    detail: |
      现在判不了机器（见 findings.checkability），所以三个指标只能靠人评，
      而真人评分意味着换模型重跑的成本极高——而"换模型要重新跑"是
      docs/Compare-Criteria.md 明写的既定需求。
      改写成「显式谓词 + 同义词表」之后四个指标才可能自动重算。
      代价是 50 条提示词的检查项全部重写，且重写会让已有语料的检查项失去对应关系
      （语料不用重新生成——检查项是后加的，与响应无关）。
    status: resolved
    resolution: |
      **2026-09-21 做完了：253 个检查项全部改写成谓词。结论与预期不同，记在这里。**

      改写让能自动算的指标从一项变成两项（解析错误率 + 谓词口径的端到端准确率），
      但**端到端准确率失去了区分力**，这是当初提这个问题的前提里没有料到的：
      a-bare 88.0%、b-documented 100.0%、c-dsl 98.0%。
      253 项里只有 23 项在三组 150 份上不是全过——检查项绝大多数是
      「有 X 节点」「X 通向 Y」这类存在性断言，而给足语法文档之后这类断言基本都成立。
      **存在性断言分不出"写对了"与"写得刚刚好"**，而后者才是差别所在。
      判定门要的「C 比 B 高 15 个百分点」在谓词口径下不可能达成，与 C 好不好无关。

      首轮通过率与人工修正步骤仍然算不了，理由与改写前相同且更清楚了：
      它们问的是"还需不需要改"，而"不需要改"包含"没有多余的东西"，
      那不是任何一条检查项描述过的内容。**所以判定门那张表仍然全部要人判。**

      改写的定位因此改成**回归网**：换模型、改提示词、动语法之后重跑，
      它能把"该有的东西丢了"当场抓出来；它抓不出"多了不该有的东西"。

      一条必须与数字一起读的局限：**谓词是拿这 150 份语料对着调出来的**。
      凡是结构上明明做到了、而谓词判成没做到的地方都放宽了（补同义词、
      把「有边」改成「可达」、允许一个节点的标签同时覆盖两件事），
      每一条都记在 predicate-report.md 的"改写过文本的检查项"里。
      所以那份数字可复现，但是"对着答案调过判据之后"的可复现，**不是独立测量**。

      三处在这一轮里改动了检查项本身，都不是放宽谓词：
      S02 两条并一条（后者是前者的推论）、C02 两条并一条（同上）、
      S04 删掉「无判定分支」（它与自己的提示词冲突——提示词写「设置成功后提示完成」，
      那句话本身就带条件，三个组都据此画了「设置成功?」；一条谁都做不到的检查项
      不区分任何东西，只把三组的分一起压低）。检查项总数 256 → 253。
    evidence: |
      reports/compare-blind/predicate-report.md（三组数字、逐检查项、改写记录、
      以及"这份数字能分辨出什么"一节）；
      tools/CompareHarness/Predicate.cs（谓词模型与求值器）；
      tools/CompareHarness/prompts.json（253 条检查项）；
      tools/CompareHarness/Verify.cs（求值器自检，40 项，不需要语料）
  - id: rejection-granularity
    question: 「解析器拒绝」的判定粒度是什么？
    detail: |
      解析错误率的分子是「解析器拒绝的数量」，而「拒绝」的定义取决于错误恢复粒度——
      一行坏掉时是跳过该行继续（那么整份不算拒绝），还是整份拒绝。
      P1-16 的 open_questions 里列了同一条，两个任务必须用同一个答案，
      否则 DSL 组与 Mermaid 组的错误率不可比。
    status: resolved
    resolution: |
      跳过坏行、记一条诊断、继续；只有「图类型不是流程图」整份放弃。
      两个解析器同一口径（P1-16 已按此实现，P1-08 本来就是）。
      落地时进一步细分成四种结局：干净 / 有诊断但有结构 / 语法拒绝 / 图类型不对，
      前两种都不算拒绝，后两种都算。
    evidence: reports/compare-blind/parse-report.md 的三组统计（a-bare 47/0/0/3，b 49/1/0/0，c 50/0/0/0）
  - id: semantic-checks
    question: 语义拒绝具体查哪些？
    detail: |
      docs/Compare-Criteria.md 举了两个例子：引用了不存在的节点、分组成环。
      完整清单要定下来并与 DiagramValidator 的检查项对齐——
      若语义拒绝的口径宽于校验器，会出现「解析器说拒绝但校验器说没问题」的矛盾。
    status: resolved
    resolution: |
      **现在算不出来，留空。** 要算得先有 Mermaid→IR（P1-09）与 DSL→IR（P1-17）的映射。

      原因在解析器的抽象语法树上，不是工程排期问题：
      Mermaid 的解析器读到 `A --> B` 会顺手把 A、B 记成节点，DSL 的只记边——
      于是「引用了不存在的节点」在 Mermaid 侧根本不可表达，在 DSL 侧却能看见。
      直接比这一项，比的是两个解析器的宽松程度，不是两种格式。
      分组的外层字段由解析器的栈赋值，成环写不出来；成员表又是从父级推出来的，
      所以「分组成环」「成员不存在」同样不可表达。

      唯一现在就能算的是「边指向分组」——它两边都可表达。
      这一列同时是 P1-09 `subgraph-as-endpoint` 的证据。
    status: resolved
    resolution: |
      **2026-09-21 算出来了，三组都是 0%。** 见 reports/compare-blind/semantic-report.md。

      分母只算解析出结构的份数（a-bare 47、b-documented 50、c-dsl 50），
      解析器整份放弃的那些单列——把它们算作"语义没问题"会凭空拉低比率。

      **这个数本身没有区分度，而它旁边那一列有。** 映射阶段消解掉的量三组不同：
      a-bare 丢掉 11 个与子图同名的节点声明、b-documented 14 个、c-dsl 改名 1 个容器。
      校验器那一步之所以全零，是因为映射层把矛盾都消解掉了——Mermaid 侧丢掉
      与子图同名的节点，DSL 侧把撞名的容器改名。两种格式都写得出不自洽的文本，
      只是这一层把两类不自洽各自抹平了。

      要量"原始声明自不自洽"，得看映射阶段消解了多少，而不是看校验器的结果。
      报告里两列都给出来了。
    evidence: reports/compare-blind/semantic-report.md
