title: DSL 词法与语法
phase: 1
status: done
depends_on: [P1-01]
estimated_loc: 400
files:
  create:
    - DuetDiagram.Dsl/DuetDiagram.Dsl.csproj
    - DuetDiagram.Dsl/Lexing/DslToken.cs
    - DuetDiagram.Dsl/Lexing/DslLexer.cs
    - DuetDiagram.Dsl/Lexing/DslSource.cs
    - DuetDiagram.Dsl/Parsing/DslAst.cs
    - DuetDiagram.Dsl/Parsing/DslParser.cs
