scope_note: |
  **本任务卡的编号是 P1-19，不是方案里的 P1-18。** 方案（与执行计划）写的是
  `P1-18-dsl-open-as-document.yaml`，但仓库里 P1-18 已经是 `P1-18-aot-smoke-test`
  （Phase 1 清单里的第 18 个 ID）。同名同 ID 会撞台账，所以顺延到 P1-19，
  文件与 `id` 都按磁盘实际取值。这一条本身仍是 Phase 1 的收尾：DSL 是 P1-16 / P1-17 的产物。

  范围里还捎带了「移除 Mermaid 导出方向」这一步：产品负责人的指令是
  「只留一个 Mermaid 导入的功能，但是还是需要导入 dsl 的功能。其他的 Mermaid 的功能都删除」。
  删导出与打开 DSL 是同一轮的两件事——前者腾出「文本导出」这个位置，后者把它填成 DSL。
