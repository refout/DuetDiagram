constraints:
  - "**按后缀挑读法只写一处**：`DocumentLaunch.FromPath` / `IsDsl`。`--open`、菜单选择器、
    `MainWindow.Save` 三处都问它——抄成三份的话迟早有一处对不上，而对不上的表现是
    「打开了、但保存写成了另一种格式」"
  - "**布局意图的归属方是人**：`MappingOptions.Owner` 给 `ConstraintOwner.Human`。
    给成模型的话，用户手工写的约束会被下一次自动重排冲掉"
  - "**「这不是 DSL」要自己判**：`DslParser` 对坏输入是宽松的，认不出的行记成诊断而不是抛异常。
    判据是「一条元素都没认出来、而且解析器还报着看不懂」——只写了头部与方向的空文档是合法的，
    照常打开"
  - "**固定位置在首帧之前播种**：`DiagramSession` 先播 `_pinned` 再算第一次绘制列表。
    晚一步的话，第一次打开看到的图与文本写的不是一回事"
  - "**写盘先写临时文件再同卷改名替换**：与 `DocumentFile` 同一套原子替换"
  - "**打开与导入是两件事**：打开得到一份独立文档（新窗口、新撤销栈、写回原文件），
    导入是把一段片段拼进当前这份（一次撤销能退回）。两条路各自的用例分开验"
  - "Mermaid 只留导入方向；导出与往返连同 `DuetDiagram.Mermaid/Export/` 一并删掉。
    报告是历史记录，不删——`reports/phase1-mermaid-export.md` 加一条带日期的后补"
