  evidence: reports/dsl-open.md
  findings:
    - id: parser-is-lenient-so-bad-file-needs-a-rule
      what: |
        DslParser 对坏输入记诊断而不抛异常，于是任意文本都能解析出一棵多半是空的树。
        「这不是 DSL」因此不能靠「解析失败」判。
      resolution: |
        判据取「一条元素都没认出来（节点、边、组合都为零）而且（文本空白或诊断数大于零）」。
        只写了头部与方向的空文档是合法的，照常打开——坏文件与空文档不是一回事。
        一条用例拿一份 IR JSON 当 DSL 打开来守这条。
    - id: pin-must-be-seeded-before-first-frame
      what: |
        固定位置落在 sidecar 的 pinnedNodes，而会话原先在建第一帧绘制列表时给的是 null。
      resolution: |
        DiagramSession.Shared 多接一个 pins 参数，在算第一次绘制列表之前播进 _pinned。
        晚一步的表现是「第一次打开看到的图与文本写的不是一回事」，用户会以为 pin 没写对。
    - id: dsl-and-dgm-share-the-sidecar-stem
      what: |
        SidecarPaths.Stem 只去一层后缀，所以 a.dsl 与 a.dgm 共用 a.user.json。
      resolution: |
        本轮 DSL 的固定位置随文本走（pin 那一行），不写 user.json，所以不冲突。
        两种文件同名同目录共存时的语义写进 docs/Sidecar.md。
    - id: read-only-export-invariant-retargeted
      what: |
        删掉 Mermaid 导出时，那条「导出不改文档版本与历史」的只读不变量测试跟着没了。
      resolution: |
        把它改成针对 DSL 导出的同名用例，与 SVG / PNG / PDF 保持同等覆盖——
        删一条判据时要在新的那一档上补回来，而不是让它凭空消失。
    - id: coverage-matrix-row-was-about-to-become-false
      what: |
        覆盖审计矩阵里「DSL 导入」原本记的是「无」，理由写着「入方向仅解析未接生产入口」。
        本轮接上了生产入口，那一行即将变成假话。
      resolution: |
        改成「有」，证据指向 DuetDiagram.App/Services/DslFile.cs；同时把「Mermaid 导出」那一行
        换成「DSL 导出」。报告里的逐档计数与覆盖率随之重算（88 / 13 / 16 → 89 / 13 / 15，
        86.3% → 87.2%）。
  not_verified:
    - 真人没有通过界面点过「打开…」的选择器——选择器在无头模式下打不开，
      能验的那一段全压在 MainWindow.Open 上（与点菜单走同一段代码）
    - 没有自动保存、没有最近文件、user.json 的读写没接
