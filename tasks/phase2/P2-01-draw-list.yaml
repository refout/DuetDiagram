    - DuetDiagram.Render.Tests/SceneSnapshotTests.cs
    - DuetDiagram.Render.Tests/FakeTextMeasurer.cs
    - DuetDiagram.Render.Tests/Layouts.cs
    - DuetDiagram.Render.Tests/Snapshot.cs
    - DuetDiagram.Render.Tests/Scenes/01-empty.txt 等十个快照
    - docs/Render-Pipeline.md
  modify:
    - DuetDiagram.Render/DuetDiagram.Render.csproj
    - DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj
