id: P2-06
title: 节点拖拽与固定
phase: 2
status: done
depends_on: [P2-05, P1-03, P1-06]
estimated_loc: 500
files:
  create:
    - DuetDiagram.App/Interaction/SelectionSet.cs
    - DuetDiagram.App/Interaction/DragSession.cs
    - DuetDiagram.App/Interaction/DragController.cs
    - DuetDiagram.E2E.Tests/DragTests.cs
