constraints:
  - "**每一条约束都带归属**，界面加的是人工约束。归属是降级矩阵的输入，缺了它降级时不知道该丢谁"
  - 约束的增删走命令，与其它修改同一条路。面板自己写 IR 的话，LLM 与界面在这件事上就不对等了
  - 界面必须能**撤销**一条约束，也能看到当前有哪些约束、分别是谁加的。只能加不能看的话，用户会反复加同一条
  - 约束指向已删除的节点时不能崩，也不能静默留着：走既有的校验路径给出结构化错误
  - 拖动生成的顺序约束要**合并**而不是每次追加。一次拖动追加一条的话，同一对节点上会积下几十条互相矛盾的顺序约束
context:
  - 方案 §9.1 把「布局约束」列为属性面板的六个分节之一，P2-05 只做了读
  - 方案 §9.2 规定框选右键创建分组与泳道，那类结构性约束的入口也在这一节
  - 方案 §4.2 规定约束记录携带归属与创建时间，六个取值方法都按归属过滤
  - 引擎侧的接线在 P2-09，本任务只做入口
scope_note: |
  **界面加的是人工约束，不是自动约束。** 自动约束由引擎推导，LLM 约束由工具写入，
  三者在降级时被丢弃的次序不同（见布局那一节的保留项矩阵）。
  界面上不区分这三者的话，用户会以为自己加的约束在降级时被保住了，
  而实际丢掉的可能是他加的那一条。

result:
  summary: |
    布局约束的界面入口落地：
    - 三类约束合成**两条**命令（`add-layout-constraint` / `remove-layout-constraint`），
      种类由参数给出。三类的成员形状不同（同层与对齐是节点，层内次序是出边），
      但增删的动作一样；一类一条命令的话，校验、原子性与撤销三套逻辑要各写三遍，
      而抄漏的那一遍不会报错，只会让某一类约束在某个入口下改不动。
    - 层内次序是**每个主语一条**：同一主语上已有次序时换掉它而不是追加。
      追加的话来回拖几次就积下几十条互相矛盾的次序，而求解器按列表顺序取第一条——
      于是生效的永远是最早那一次，用户后来拖的几下全都白做。
    - 属性面板那一节从"只读的一段文字"变成可增删的列表：每行写清哪一类、成员是谁、
      归属是谁，人工加的那几行带删除按钮，下面三颗常驻按钮加同层 / 对齐 / 层内次序。
      加不了的按钮是灰的——让用户点下去再收到一句"选得不够"，他会以为是自己点错了。
    - 只有人工加的能删。引擎推出来的删了下一轮还会回来；模型提的被界面删掉之后，
      模型那边不知道自己提的东西没了，下一轮还会再提一次。
    - 加与删都走命令层，加完重排一次。约束本身不进坐标，但它决定坐标——
      只重绘不重排的话，用户看到的是"我加了一条约束，画面纹丝不动"，然后会再点一次。
    - 节点拖拽松手时指针底下压着谁决定落定成什么：压在另一个**兄弟节点**上落定的是一条
      层内次序（不写固定位置），落在空白处才是绝对位置。合并以"上一次人工拖出来的次序"为底，
      剔掉已删的边、接上还没排进去的出边。
    - 约束指向的节点被删掉之后，那条约束留在列表上（它确实还在文档里），
      既不会把界面搞崩，也不会悄悄消失——用户要能看到"这条没用了"，然后删掉它。
    - 自检那一帧的文档带着两条约束，而且是经命令层加进去的；自检另外核对约束条数不低于两条，
      否则"约束生效了没有"就退化成一句空话。
