acceptance:
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -- --filter-trait "Category=ErrorPresentation"
    expect: 全通过；错误码枚举逐个查表，漏一个就红；呈现方式与错误码文档里的表逐行一致
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -- --filter-trait "Category=LayoutFailure"
    expect: 全通过；布局全部降级失败后画面仍是上一次成功的结果，状态栏是红的，三个选项都在
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=IrValidator"
    expect: 全通过
constraints:
  - "**呈现方式由错误码查表决定，不在各处就地判断。** 就地判断的结果是同一个错误码在两个入口给出两种呈现，而用户以为遇到的是两个问题"
  - 表格**必须覆盖全部错误码**，漏一个就是一次没有反馈的失败。漏项用一个测试挡住：拿错误码枚举逐个查表，查不到就红
  - "**失败要留痕。** 布局全部降级失败时保留上一次成功布局，画面不清空——清空会让用户以为图丢了"
  - 无操作的失败（例如无可撤销）在状态栏灰显，不弹窗。弹窗打断的是整条操作链，而这类失败本来就没有需要用户决策的事
  - 内部错误只显示"内部错误，已记录日志"，不把异常类型名或堆栈显示给用户；细节进应用日志
  - 版本冲突必须弹差异对话框，不能只给一句"版本冲突"——用户拿不到差异就无从知道冲突在哪，只能放弃自己的改动重来
context:
  - 方案 §9.4 规定布局失败时保留上一次成功布局、状态栏红色提示、给重试 / 手动布局 / 简化图三个选项
  - 方案 §9.6 给出错误码到界面处理的对照表，含无操作的灰显规则
  - 方案 §11.2 规定 Sidecar 的五级恢复，其中两级要弹对话框
  - 方案 §4.4 规定命令错误是结构化的，且审计日志里不写异常类型名
  - 错误码清单与含义在错误码文档里，本任务要把那张表补上界面呈现这一列
scope_note: |
  **手动布局模式是本任务唯一的新交互，而它做得很薄。**
  方案把「手动布局」列为布局失败后的三个选项之一，但它到底意味着什么，
  方案没写。本任务只做"降级之后不再自动重排、由用户显式触发"这一层，
  不做完整的手动摆放工具——那是一个独立的编辑器功能，不该顺手塞进来。

result:
  summary: |
    错误码呈现与布局失败处理落地：
    - `ErrorPresenterTable` 是唯一的呈现对照表，覆盖全部 25 个错误码；呈现方式只有七种
      （高亮相关元素、问一句要不要创建、弹差异对话框、状态栏、状态栏灰显、认证失败、
      弹布局失败提示）。漏一个码就是一次没有反馈的失败，由 `Category=ErrorPresentation` 逐个查表挡住；
      同一个门禁还拿 `docs/Error-Codes.md` 里那张表逐行核对，两张表分头维护迟早会分叉。
    - `DiagramSession` 的 `Reload` 捕获 `LayoutFailedException`：**保留上一次成功的 `Scene`**，
      另发 `LayoutFailed` 通知。失败不清空画面——清空会让用户以为图丢了。
    - 主窗口接上 `StatusBar`（按严重度着色：红 / 灰 / 常规）、`LayoutFailureDialog`
      （重试 / 手动布局 / 简化图）与 `SidecarRecoveryDialog`（从备份恢复 / 放弃人工调整）。
      布局失败时画面不动、状态栏变红、提示浮出；重试成功或排布成功之后提示与红字一起收掉。
    - 三个选项各自的含义：重试换成长的那一档总预算（`LayoutBudgets.ManualRelayout`）；
      手动布局进入"不再自动重排、位置冻住"的模式；简化图把这一轮降级丢掉的约束摆出来，
      **只指出来，不替用户去掉**。
    - 手动布局模式只冻坐标：绘制列表按当前文档重画一遍，标签与样式仍然跟着文档走。
    - 布局引擎可注入（`SampleDiagram.Build` / `DiagramSession` / `MainWindow`），
      用途只有一个——让"布局彻底失败"这条路径能被真正走到。
    - 命令结果里没写进去的那些（被拒与无操作）走 `CommandReported` 到状态栏，无操作灰显不弹窗。
  gates:
