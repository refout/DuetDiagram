    - "dotnet test --project DuetDiagram.E2E.Tests -- --filter-trait Category=LayoutFailure => 6/6 通过"
    - "dotnet test --project DuetDiagram.Core.Tests -- --filter-trait Category=IrValidator => 23/23 通过"
    - "端到端全量 58/58 通过；核心 248/248、渲染 145/145、布局 75/75"
    - "dotnet run --project DuetDiagram.App -c Release -- --selftest => 自检通过（5 节点 / 5 连线，17 条绘制指令全部被消费）"
    - "dotnet run --project DuetDiagram.App -c Release -- --benchmark-frames --nodes 1000 --frames 120 => 达标（虚拟化单帧平均 10.83 ms，约 92.4 帧每秒；剔除率 86.3%）"
  followups:
    - "打开文档那条路还没做，所以 `SidecarRecoveryDialog` 只有宿主能触发，现在由端到端用例直接驱动。"
    - "重试换的是总预算，每级分到的仍是降级计划里的固定值；把每级预算一起放大要先定「重试最多等多久」。"
    - "完整的手动摆放工具（拖动落位、吸附、成批对齐）是独立功能，不在本轮范围。"
