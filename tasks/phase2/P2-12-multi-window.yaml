id: P2-12
title: 多窗口与多进程
phase: 2
status: pending
depends_on: [P2-11, P1-02]
estimated_loc: 480
files:
  create:
    - DuetDiagram.App/Services/WorkspaceRegistry.cs
    - DuetDiagram.App/Services/DocumentLock.cs
    - DuetDiagram.App/Services/Heartbeat.cs
    - DuetDiagram.E2E.Tests/MultiWindowTests.cs
    - DuetDiagram.Core.Tests/DocumentLockTests.cs
    - reports/phase2-multi-window.md
  modify:
    - DuetDiagram.App/Program.cs
    - DuetDiagram.App/App.axaml.cs
    - DuetDiagram.App/MainWindow.axaml.cs
