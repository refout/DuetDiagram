    - "`pinnedNodes` / `pinnedEdges` 不进 IR，所以只读那一份即使改不了文档也不影响它；等人工产物也落盘之后，只读的那一侧同样要挡住写回。"
    - "跨进程只做了锁与只读退档，没有做"另一个进程改了之后这边跟着刷新"——那需要文件监听或版本轮询，属另一件事。"
