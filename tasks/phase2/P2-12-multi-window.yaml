acceptance:
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -- --filter-trait "Category=MultiWindow"
    expect: 全通过；同一进程开两个窗口改同一文档，两个窗口都刷新且版本不冲突
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=DocumentLock"
    expect: 全通过；占用、超时抢占、心跳过期判定各有用例
  - command: 起第二个进程打开同一份文档
    expect: 第二个进程只读，状态栏给出提示，不写盘
constraints:
  - "**同一进程内共享工作区，不各开一份。** 各开一份的话两个窗口各有各的文档与历史栈，改一边另一边不动，而用户以为在看同一份文件"
  - 多进程用锁文件，且**锁与心跳是两个文件**：锁文件用独占共享模式，心跳文件用允许读写的共享模式。合成一个的话，心跳的写入会与锁的独占冲突，表现是"第一个进程一写心跳就把自己锁死"
  - 崩溃判定靠心跳超时，不靠进程句柄——进程被强杀时句柄不一定及时释放，而心跳会停
  - 抢占之后**必须重新校验**：心跳超时只是"疑似崩溃"，抢占前要确认那份文档没有被真正写坏
  - 第二个进程只读时，界面上所有写入口都要禁用，不只是加一句提示。留一个能点的按钮就是一个能造成损坏的入口
  - 广播器所有权按既有约定：共享的那个只有创建者负责释放
context:
  - 方案 §9.5 规定单进程多窗口共享工作区并通过进程内广播器刷新；多进程用锁文件加心跳，超时十五秒判定崩溃可抢占，第二实例只读
  - 方案 §4.10 的工作区已经承载文档、总线与广播器所有权
  - 方案 §14.4 的端到端场景里有一条：两个窗口同时改同一文档，无数据损坏
  - 方案 §14.3 的 Phase 2 判据里没有直接对应多窗口的一条，但它是 §9.5 的完整实现
scope_note: |
  **这一条不是"顺手做一下"。** 方案把它单列成一节，而且端到端场景里有对应条目，
  说明它是产品行为而不是实现细节。心跳周期与超时都写进常量并在一处定义，
  与渲染阈值同样的理由：写在两处之后对不上，而对不上时的表现没有规律。
result:
  summary: |
    - 跨进程所有权落在 `DuetDiagram.Core/Workspace`：`DocumentLock`（独占句柄 + 只读退档）
      与 `Heartbeat`（周期 5 秒、超时 15 秒，两个常量定义在同一处）。
      **句柄是判据，心跳是补充**：拿得到独占句柄就说明没有活着的持有者，
      心跳只管"拿不到时对方是正在干活还是已经卡住了"。抢占前要先删得掉锁文件，
      而删不掉才是"别抢"的真正判据——心跳过期只触发去试。
    - **锁与心跳是两个文件**，理由写在 `Heartbeat` 的类注释里：合成一个的话，
      心跳的写入会撞上锁的独占，表现是"第一个进程一写心跳就把自己锁死"，
      而且只在第一次心跳到点时才出现。
    - 正常退出清掉心跳、异常退出留下它，于是"心跳文件还在"就是"上一次没好好退出"。
      `TookOver` 把这件事报给调用方，调用方必须重新校验那份文档——
      由 `DocumentLaunch.File` 做：抢占且校验不过就拒绝打开，而不是让人在截断的图上继续编辑。
    - `DuetDiagram.App/Services/WorkspaceRegistry.cs`：进程内按标识引用计数地共用工作区，
      **跨进程那把锁也挂在这张表上**（挂在窗口上的话，同进程第二个窗口会撞上第一个窗口
      自己加的锁，于是变成只读）。最后一个租约还回来时才释放工作区，再放锁。
    - `DocumentLaunch` 描述"看哪份文档"：示例文档每次给一个新标识（免得测试里第二个用例
      拿到第一个用例改过的文档），从文件打开的用文件全路径（两个窗口打开同一个文件就共用）。
    - 跨窗口刷新：`DiagramSession` 订阅广播器，收到比手上绘制列表更新的版本就发
      `DocumentChanged`；宿主把它排到界面线程上重算。自己发出去的命令也会广播回来，
      靠 `SceneVersion` 挡掉，否则每改一次白算两遍布局、界面连闪两帧。
    - 只读那一份把**所有写入口**都禁掉，而不只是加一句提示：属性字段进只读档
      （文本框用 `IsReadOnly` 而不是 `IsEnabled`——禁用的框连选都选不中，用户没法复制内容）、
      约束的加与删按钮灰掉、画布的拖拽 / 连线 / 重连 / 折点手势在入口处直接不进。
      挡住写入的仍然是会话那一层（`Refuse()` 返回 `DOCUMENT_READ_ONLY`）：
      界面上的入口不止一处，漏掉哪一处都看不出来。
    - `DOCUMENT_READ_ONLY` 是新错误码，与 `VERSION_CONFLICT` 分开：后者是"同步一下再重试"，
      这一条是"这份文档上不允许"。呈现落在状态栏灰显那一档，并且状态栏另有一句常驻说明，
      与"最近一次操作的结果"分开——两者的寿命完全不同。
    - `Ctrl+N` 再开一个窗口看同一份文档；`Ctrl+S` 写回文件（先写临时文件再同卷改名替换）。
      文档没有文件时给一句灰显说明，只读时不提示——那句常驻说明从打开起就一直在。
