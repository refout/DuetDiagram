files:
  create:
    - DuetDiagram.Core/Commands/Builtin/UpdateNodeLabelCommand.cs
    - DuetDiagram.Core/Commands/Builtin/MoveNodeLayerCommand.cs
    - DuetDiagram.Core/Commands/Builtin/SetNodeShapeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/ReorderNodeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/DisconnectEdgeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/SetEdgeRouteCommand.cs
    - DuetDiagram.Core/Commands/Builtin/AddEdgeWaypointsCommand.cs
