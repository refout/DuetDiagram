acceptance:
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=Atomicity"
    expect: 全通过
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=LayoutConstraint"
    expect: 全通过；set-place 与既有的同层 / 对齐 / 层内次序三类约束不互相打架
  - command: dotnet test --project DuetDiagram.Layout.Tests/DuetDiagram.Layout.Tests.csproj -- --filter-trait "Category=Layout"
    expect: 全通过；方向与间距改动之后确实触发重排，固定位置保留到最后一级之前
constraints:
  - "**布局类命令必须让 `CommandResult` 的结构变更标志为真。** 报成纯外观的话，宿主会只重绘不重排，而画面上的坐标根本没跟着约束变"
  - "`set-place` 是**相对位置**，与既有的同层 / 对齐 / 层内次序三类约束并存。四类都落在 `layout` 子对象上，写入时要合并而不是覆盖整份 `LayoutHints`——覆盖的话，加一条相对位置会把之前加的同层约束悄悄删掉"
  - "`pin-node` 与 `unpin-node` 走命令总线（进 IR）；而 Phase 2 的拖拽落点走 sidecar 的 `pinnedNodes`。两者**不是同一件事**：前者是 LLM 或命令明确表达的意图，后者是用户拖出来的产物。写清楚它们的边界，否则同一个节点会有两个互相矛盾的固定位置"
  - "调色板的增删改要让引用它的样式令牌失效得看得见：删掉一个还在被引用的令牌时返回结构化错误并列出引用者，不要留下悬空引用"
  - "`Validate` 返回结构化 `CommandError`；`CaptureMemento` 与 `Apply` 索引一致；新增 Memento 记录补 `[JsonDerivedType]`"
context:
  - 方案 §5 的四级降级与布局提示；方案 §5.3 ApplyFallback 按级别裁掉 Llm / Human / Auto 三类提示
  - 方案 §9.2 的 set-place 与三类约束并存
  - "`DuetDiagram.Core/Commands/Builtin/AddLayoutConstraintCommand.cs` 是三类约束的现成骨架"
  - "`docs/Layout-Constraints.md` 记着三类约束的成员形状与合并口径"
scope_note: |
  **`pin-node` 与 sidecar 的 `pinnedNodes` 是两个来源，这一点必须写在文档里。**
  P2-06 已经定下「拖动产生的固定位置不进 IR」，理由是拖动一次会塞进几百条 IR 记录、
  撤销栈失真。命令层的 pin 是另一回事：它是明确的意图表达，量少、该进 IR、该进撤销栈。
  布局求解时两者要合起来看，谁优先得在文档里定死，否则同一个节点会有两个固定位置。
