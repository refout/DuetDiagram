id: P3-03
title: 补齐命令层——组合与图层
phase: 3
status: pending
depends_on: [P1-03, P1-04]
estimated_loc: 480
files:
  create:
    - DuetDiagram.Core/Commands/Builtin/CreateCompositeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/DissolveCompositeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/MoveIntoCompositeCommand.cs
    - DuetDiagram.Core/Commands/Builtin/CreateLayerCommand.cs
    - DuetDiagram.Core/Commands/Builtin/RenameLayerCommand.cs
    - DuetDiagram.Core/Commands/Builtin/ReorderLayerCommand.cs
    - DuetDiagram.Core/Commands/Builtin/AssignLayerCommand.cs
  modify:
