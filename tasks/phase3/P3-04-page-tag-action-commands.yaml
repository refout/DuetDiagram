reconnaissance: |
  动手前对着代码把八条命令逐条核了一遍。结论如下，其中两条推翻了起草这份任务时的假设。

  ### 1. 八条里没有一条被字段表覆盖

  字段表按「某个元素上的某个字段」分发（`set-node-field` / `set-edge-field`）。
  这一批改的全是**集合级的元素增删**（页面、标签、动作）与**文档自己的属性**
  （`kind`）与**文档子对象**（`canvas`），四类都不在元素字段表的射程里。
  三个元素级名字 `@page` / `@tag` / `@action` 早就登记在 `FieldRegistry` 里了，
  但登记的是「整个元素被增删」这个粒度，不是「某个字段改了」。
  所以八条命令各立一条，一条都不合并。

  ### 2. 哈希口径（对着 `DiagramHashing` 逐块核过）

  | 改的东西 | 结构哈希 | 视觉哈希 | 依据 |
  |---|---|---|---|
  | `kind` | 进 | 进 | `StructuralContent` 第一行的 `k|` |
  | `pages` | 不进 | 进 | `AppendVisualContent` 的 `pg|` 块 |
  | `tags` | 不进 | 进 | 同上的 `t|` 块 |
  | `actions` | **不进** | **不进** | 全文没有任何一块覆盖它 |
  | `canvas` | 不进 | 进 | 同上的 `cv|` 块 |

  由此推出两条容易写错的：`add-action` / `remove-action` 必须报
  `structural: false, visual: false`——报成视觉变更会让宿主白白重绘一次，
  而画面上一个像素都不会变。`set-canvas-settings` 报 `visual: true, structural: false`，
  与调色板那三条同一档。

  注意两个标志都假**不等于**无操作：`IsEffectiveSuccess` 只看 `IsNoOp`，
  所以版本照推、历史照进、广播照发，只是宿主不重排也不重绘。
  动作确实进了文档内容（序列化里有它），只是进不了那两个摘要。

  ### 3. `remove-tag` / `remove-action` 不存在「元素上还挂着它」

  起草这份任务时写了一条约束，要求这两条命令处理「元素上还挂着它」的情况。
  对着模型核完发现**这件事不存在**：`TagDef.Members` 与 `ActionDef.Target`
  都是**单向**的，被指向的元素上没有回指字段——`NodeDef` 里根本没有标签字段，
  也没有动作字段。删一个标签就是删掉它的成员列表本身，删一个动作就是删掉它的目标引用本身，
  两个方向都不会留下悬空引用，所以没有东西要「一并摘掉」。

  反过来的那两件事——删掉一个元素之后，某个标签的成员列表里、某个动作的目标里
  还写着它——由整体校验器报 `TAG_MEMBER_MISSING` / `ACTION_TARGET_MISSING`。
  那与删边留下的悬空次序是同一口径：**命令层留着不管，让第二个地方去报**。

  ### 4. 顺手要补的一处：删调色板条目漏了标签这一条引用路径

  `TagDef.Color` 的注释写明「取调色板令牌名」，而 `remove-palette-entry` 的引用者扫描
  只看了节点与边。`add-tag` 落地之前这个字段没有任何命令能写，所以漏着不显；
  落地之后它就成了第三条引用路径。不补的话，删掉一个被标签引用的令牌，
  标签的颜色会静默退回兜底值——不报错、不崩，用户看到的是一次「什么都没发生」的删除，
  而那条命令自己的说明里写的正是要避免这件事（判据是「这件事有没有第二个地方能看见」）。
  补一个扫描分支加一条用例，不动命令的形状。

  ### 5. 两个新错误码之外一律复用

  - 删不存在的页面报 `PAGE_MISSING`；删最后一页报 `PAGE_REQUIRED`。
  - 删不存在的标签 / 动作报 `TAG_MISSING` / `ACTION_MISSING`。
    （与 `LAYER_MISSING` / `COMPOSITE_MISSING` / `PALETTE_ENTRY_MISSING` 同一形状：
    删除一个点名的不存在的东西是**失败**而不是无操作，因为那通常说明调用方手上那份列表过期了。）
  - `add-tag` 的成员不存在复用 `TAG_MEMBER_MISSING`，`add-action` 的目标不存在复用
    `ACTION_TARGET_MISSING`——整体校验器报的也是这两个码，两处含义相同，不另起名字。
  - 四个新码都要进 `docs/Error-Codes.md` 的两张表与 `ErrorPresenterTable`，
    否则 `Category=ErrorPresentation` 会红。

  ### 6. `set-canvas-settings` 取逐项可选参数，不取整份替换

  与 `set-spacing` 同一口径：整份替换要求调用方先把没打算改的项读回来再写回去，
  而那份读回来的值可能已经过期——一次「只改网格」的调用会把背景色悄悄改回旧值。
  背景色这一项用**空串表示清除**、`null` 表示不动：`null` 在可选参数里已经占了
  「这一项不动」的意思，清除只能另给一个信号；空串在字段写入那条路上本来就是
  「这个字段没有值」的写法，两处一致。

  六个成员各登记一个字段名（`canvas.grid` 等），让变更明细的粒度落到成员上。
  只用一个 `canvas` 的话，一边改网格、一边改背景色会被判成冲突，而那是两次互不相干的修改。

scope_note: |
  这一条是四条命令层任务里最没有耦合的一条：八个命令各自独立，不依赖前三条。
  放在最后写，是因为工具层用到它们的只有 `diagram_edit` 的几个 action 与
  `diagram_validate`，不像节点 / 边 / 样式那几组那样卡住整条工具链。

result:
  summary: |
    - **八条命令，四条线。** 页面两条：`CreatePageCommand`、`DeletePageCommand`。标签两条：
      `AddTagCommand`、`RemoveTagCommand`。动作两条：`AddActionCommand`、`RemoveActionCommand`。
      文档设置两条：`SetKindCommand`、`SetCanvasSettingsCommand`。**命令层到此补齐**——
      计划表里剩下的条目要么已由字段表覆盖，要么不该有命令，没有待办。
    - **起草时的假设被代码推翻一条。** 那份任务 YAML 写着「`remove-tag` / `remove-action`
      要处理元素上还挂着它的情况」。核完发现**这件事不存在**：`TagDef.Members` 与
      `ActionDef.Target` 都是单向的，被指向的元素上没有回指字段（`NodeDef` 里根本没有
      标签字段）。删一个标签就是删掉那份成员列表本身，删一个动作就是删掉那份引用本身，
      两个方向都不会留下悬空引用。所以两条命令都不需要顺带摘掉任何东西。
      反过来那件事由整体校验器报 `TAG_MEMBER_MISSING` / `ACTION_TARGET_MISSING`，
      与删边留下的悬空次序同一口径。这条约束改成了记录这个结论。
    - **同一次核对翻出一处真的漏洞。** `RemovePaletteEntryCommand.Referrers` 只扫了节点与边，
      漏了 `TagDef.Color`——那个字段取的就是调色板令牌名。`add-tag` 落地之前它没有命令能写，
      所以漏着不显；落地之后它就成了第三条引用路径。不补的话，删掉一个被标签引用的令牌，
      标签的颜色会静默退回兜底值，不报错也不崩，而那条命令自己的说明里写的正是要避免这件事。
      补了一个扫描分支加一条用例（`An_entry_a_tag_still_uses_is_not_removed`）。
    - **`add-action` / `remove-action` 是唯一一组两个变更标志都报假的命令。** 动作不进任何哈希，
      加一条动作既不改变坐标也不改变像素。报成视觉变更会让宿主白白重绘一次。
      用例同时钉住另一半：两个标志都假**不等于无操作**——版本照推、历史照进，
      判断要不要触发副作用一律用 `IsEffectiveSuccess`。
    - **`delete-page` 挡住最后一页。** 新码 `PAGE_REQUIRED`。页面集合为空之后渲染层无页面可画，
      而那不是一次「删掉了一个东西」能解释的状态，所以限制放在命令层而不是留给渲染层兜底。
      它与「页面不存在」分开：那一种是标识写错了，这一种是先建一页再删。
    - **撤销页面删除要插回原来那一格。** `PageMemento` 记的是整份有序集合。
      一律追加到末尾会改变页面次序，而两个哈希都按标识排序后遍历，这个错在哈希上看不出来——
      用例断言的是集合顺序，不是哈希。
    - **`set-canvas-settings` 取逐项可选参数，背景色用空串表示清除。** 与 `set-spacing`
      同一口径：整份替换会逼调用方先把没打算改的项读回来再写回去，而那份值可能已经过期。
      清除只能另给一个信号，而空引用在可选参数里已经占了「这一项不动」的意思。
      六个成员各登记一个 `canvas.*` 字段名，好让变更明细的粒度落到成员上。
    - **顺手把两条陈旧的地方修了。** 错误码文档里 `GROUP_MEMBER_MISSING` 与 `GROUP_CYCLE`
      还写着「Phase 4」，而 P3-03 已经用上了；`ConflictTests` 里那条
      「命令发出的字段名都要登记」的门禁原先只覆盖四条命令，扩到覆盖本批八条——
      它正是挡「新增字段没登记」的那道网，覆盖面窄了等于没网。
    - **CI 补了一道哈希覆盖门禁。** `Category=IrHashing` 原先只跑在完整测试里。
      这一条退化的表现是「改了某个东西，宿主却不知道该不该重排/重绘」：
      该进结构哈希的没进，改了间距图不重排；不该进的进了，加一条动作让所有 agent 的
      版本检查报冲突而画面上什么都没变。两种都不会让别的测试变红。
    - 用例：`PageTagActionCommandTests.cs` 与 `DocumentSettingCommandTests.cs`，
      另有 `PaletteCommandTests` 补一条标签引用者、`ValidatorTests` 未动。
      `Harness` 补了八条命令的快捷方法与 `Page` / `Tag` / `Action` 三个按标识取定义的辅助。
