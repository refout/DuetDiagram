constraints:
  - "**端口解析这一条已经在 P3-07 做掉了，这一轮不再重复。** `fromPort` / `toPort` 确实是边上的字段，但 `EdgeFieldValue` 的字段表里**只有 label 与 style**——端点四样必须作为一次操作一起生效。P3-07 的 `connect-edge` / `reconnect-edge` 已经用 `PortParser` 把「标识.端口名」拆开交给重连类命令，所以 `diagram_layout` 与 `diagram_composite` 的参数表里根本没有端点。**不在这里给字段表加两个名字**：逐字段写会在中途留下一个端点对不上的边"
  - "**`diagram_layout` 改完必须触发重布局，而触发由宿主决定。** 工具层把命令的 `CommandResult` 翻译成 `CommandOutcome`，里面的结构变更标志就是给宿主的那个信号。工具层自己调布局引擎的话，`DuetDiagram.Llm` 就依赖了布局引擎，而布局引擎是第三方组件——这一层不该有它。所以这一条在本任务里的可验形式是「结构变更标志为真」，真正的重排调度在宿主那一侧"
  - "**`pin` / `unpin` 不做，也没有对应动作。** 命令层没有这两条命令，IR 里也没有能存绝对坐标的地方——节点的固定位置落在 sidecar 的 `pinnedNodes`。所以任务起草时写的「pin 与 sidecar 的固定位置两回事、合并规则要写进文档」这件事**不成立**：只有一处存放处，没有可合并的两份。写进文档的应当是「固定位置只有 sidecar 一处，工具层不为它开 action」，与折点同一口径"
  - "**归属由调用方显式给出，而工具层只认 `llm`。** 命令层不给默认值，理由是默认值会让模型那条路径悄悄写出人工归属的约束，而降级时被当成「用户设的」保住。工具层就是模型那条路径，所以 `owner` 缺省时写 `llm`（这是事实），而 `human` 被拒绝——放行的话模型可以伪造最高优先级的归属，把用户自己设的约束挤掉。`auto` 放行：它是更弱的一档，模型表达「这只是个建议」是合理用法"
  - "**组合的嵌套深度上限从命令层读，不在工具层另写一个数。** `CompositeLimits.MaxDepth` 是命令层的前置检查与整体校验器共用的那一个常量；工具层不判深度，让命令去报 `COMPOSITE_TOO_DEEP`"
  - "`diagram_composite` 的动作表在 Phase 3 就按命令层已有的能力给全：命令层恰好有 create / dissolve / move-into 三条，所以动作表就是这三条，没有「尚未支持」的占位"
  - "**折点没有 action。** 折点写在 sidecar 的 `pinnedEdges`、不进 IR 也不走命令总线，所以它不该出现在 `diagram_layout` 或 `diagram_edit` 的 action 表里。工具层为它开一个 action 的话，那条 action 要么绕开总线直接改 sidecar（于是撤销栈与广播都不经过），要么给折点立一条命令（于是推翻 P2-07 的决定）"
  - "**动作表与命令清单的对照要一起长。** P3-07 在文档里加了「工具 | 动作 | CommandId」那张表，这一轮往它后面追加 `diagram_layout` 与 `diagram_composite` 那八行；`Category=ToolDispatch` 的用例会逐行核，漏一行就红"
context:
