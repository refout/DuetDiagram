constraints:
  - "**`diagram_undo_redo` 走的是同一条历史栈。** 人和模型共用一个撤销栈，不是两条。分成两条的话，用户按 Ctrl+Z 撤掉的可能是模型十步之前的改动，而界面上看不出这件事——这条正是「人和 LLM 能力对等」的直接体现"
  - "**撤销到模型自己的改动时，返回里要说清撤掉的是哪一条。** 模型需要知道自己刚才那一步被撤了，否则它会以为文档还停在自己写完之后的状态。做法是**调撤销之前先窥一眼栈顶**（`HistoryStack.PeekUndo()`），拿到命令标识与会话标识；栈顶那一条的会话与当前会话相同就说「你自己改的」。不靠撤销之后去翻版本日志：那条路要多读一份日志，而日志的用途是审计"
  - "**`diagram_validate` 返回的是结构化错误加修复建议，不是一句「校验失败」。** 修复建议的映射表**已经存在**——`ValidationIssue.Suggestion` 由整体校验器逐条给出，那就是唯一的一处。工具层再写一张按错误码查的表，同一个码就会在两个入口给出两种建议"
  - "位图 / PDF 导出在 Phase 3 还没有实现，返回结构化「尚未支持」并说明缺什么。返回一张空图或者静默成功，比返回「尚未支持」糟得多"
  - "**DSL 导出同样返回结构化「尚未支持」。** 这一条与上面那条不同：它不是「还没排到」，而是**不该现在做**——`DuetDiagram.Dsl` 只有词法、语法与语义映射三样，没有导出方向；而 DSL 去留那个决策门还开着，判掉之后写出来的导出器要整个删掉。所以这一轮只做已有的那一半"
  - "导出不改变文档，所以它不得触发版本号变化，也不得进撤销栈"
  - "**多步撤销重做要能整体回滚。** 一次工具调用要么全部成功要么全部回滚。逐步调 `Undo()` / `Redo()` 时，某一步失败要把已经成功的那些反向做回去——半途停下的文档比整条失败更难收拾"
