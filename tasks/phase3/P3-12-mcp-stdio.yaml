id: P3-12
title: MCP Server——标准输入输出
phase: 3
status: pending
depends_on: [P3-05, P3-11]
estimated_loc: 450
files:
  create:
    - DuetDiagram.Mcp/DuetDiagram.Mcp.csproj
    - DuetDiagram.Mcp/Program.cs
    - DuetDiagram.Mcp/Server/DiagramMcpServer.cs
    - DuetDiagram.Mcp/Server/SessionState.cs
    - DuetDiagram.Mcp/Server/StdioLogging.cs
    - DuetDiagram.Mcp.Tests/DuetDiagram.Mcp.Tests.csproj
    - DuetDiagram.Mcp.Tests/StdioTests.cs
    - DuetDiagram.Mcp.Tests/SessionStateTests.cs
  modify:
