  - command: dotnet test --project DuetDiagram.Mcp.Tests/DuetDiagram.Mcp.Tests.csproj -- --filter-trait "Category=ChangePush"
    expect: 全通过；文档变更被推给已连接的代理，断线之后重连仍能拿到当前版本
constraints:
  - "**网络传输默认用无状态模式。** 有状态会让请求必须落到同一个实例上，运维成本高得多。而无状态模式下服务端不持有服务容器，非基础类型参数会被当成工具参数——所以会话状态必须显式传入"
  - "**认证、限流、路径逃逸三样都要有独立的拒绝路径与独立的错误码。** 合成一个「拒绝」的话，代理侧没法区分「令牌过期了」和「你调得太快」——而这两件事的处置完全不同（一个去换令牌，一个退避重试）"
  - "**`--workspace` 限定的路径逃逸检测要在解析之后、打开之前做**，不要只在字符串层做前缀比较。字符串比较挡不住 `..` 与符号链接，而这两种都是最普通的写法"
  - "**单次调用 30 秒超时。** 超时要把命令执行取消掉，不能只是返回一个超时响应而让命令在后台跑完——那样文档会被改，而调用方以为没改成"
  - "**审计日志脱敏。** 令牌、完整文件路径不进审计日志；审计日志与 `AuditLog` 是两份东西，前者记调用，后者记文档变更"
  - "**主动推送要能处理断线。** 连接断了之后变更仍在发生，重连时按版本号补差，不是重放全部通知"
  - "限流是每令牌每分钟 N 次，超限返回 429 并带上重试间隔"
context:
