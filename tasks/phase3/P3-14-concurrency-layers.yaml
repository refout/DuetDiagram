constraints:
  - "**软锁与文档锁是两件事，不要合并。** 文档锁（P2-12）管的是「这个进程在编辑这份文件」，粒度是进程与文件，用独占句柄；软锁管的是「这个 agent 正在改这份文档」，粒度是文档，TTL 30 秒、无操作自动释放。合并的话，一个卡住的 agent 会让整个进程连只读都退不进去"
  - "**软锁到期要真的自动释放，且释放前要确认持有者没有再动。** 只看时间戳的话，一个每 29 秒动一次的 agent 会被判定为过期，而它其实正在写"
  - "**四种冲突返回策略逐条实现，不合并。** 「Agent 未声明 clientState → FullSnapshot」「版本相等 → Empty」「在日志范围内且 hash 匹配 → Reference」「超范围或 hash 不匹配 → FullSnapshot」——四种的分界是能不能只回差异，合并任意两种都会让某一类调用方拿到它不需要的全量或者拿不到它需要的差异"
  - "**`409` 必须带上差异。** 只回一句「版本冲突」的话，代理无从知道冲突在哪，只能整份重读再重试，而重试大概率还是冲突"
  - "**权限判定在会话那一层，不只在界面上。** 界面上的入口有七处（P2-12 已经踩过一次），漏掉哪一处都不会报错，只会留下一条能造成损坏的路。工具层与代理层同样要判"
  - "**图层级 ACL 绑定认证主体**，不是绑定连接。绑定连接的话，同一个令牌换一条连接就能绕过限制"
  - "新增错误码要同时补 `docs/Error-Codes.md` 的表与呈现映射；`Category=ErrorPresentation` 会逐行核对"
