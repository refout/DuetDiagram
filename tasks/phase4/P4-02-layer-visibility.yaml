constraints:
  - "**可见与锁定是两件事，不许合成一个开关。** 可见是不画；锁定是画出来但不能改、点不中。合成一个的话，「我想看着它但别动它」这个最常见的诉求表达不出来"
  - "**绘制次序按图层顺序（数值大的在上面）。** 不看顺序的话，图层就退化成一个分组标签，而用户以为自己在控制前后关系"
  - "**没有图层的元素按一个隐含的缺省图层处理，位置固定。** 让它随图层顺序浮动的话，每加一个图层就有一批元素莫名其妙地换前后"
  - "**命中测试跳过不可见与锁定，绘制列表只跳过不可见。** 两处判据不一致的表现是「点得中一个看不见的东西」"
  - "**变更类型要如实报。** 三个字段（可见、锁定、顺序）都在**视觉哈希**里，所以只报外观变更；但锁定还改变命中测试的结果——要核宿主是不是只在结构变更时重建命中索引，是的话这一条要一并处理，否则锁上之后还能点中"
  - "两条命令都要有原子性用例；`RestoreCore` 必须还原到改之前的值"
context:
