  create:
    - DuetDiagram.Core/Commands/Builtin/SetLayerVisibleCommand.cs
    - DuetDiagram.Core/Commands/Builtin/SetLayerLockedCommand.cs
  modify:
    - DuetDiagram.Core/Commands/CommandMemento.cs
    - DuetDiagram.Core/Model/PageAndLayer.cs
