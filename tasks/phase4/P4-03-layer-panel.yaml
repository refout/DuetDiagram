  - "**当前图层要有明确落点。** 新建的元素归到哪一层由它决定；没有它就只能归到缺省层，而用户以为自己在第二层上画"
  - "锁定图层上的元素不许被挪进别的图层；别处的元素也不能落进锁定层里，两个方向都要给出结构化错误"
context:
