id: P4-03
title: 图层面板与归属入口
phase: 4
status: pending
depends_on: [P4-01, P4-02]
estimated_loc: 450
files:
  create:
    - DuetDiagram.App/Controls/LayerPanel.axaml
    - DuetDiagram.App/Controls/LayerPanel.axaml.cs
    - DuetDiagram.App/ViewModels/LayerPanelViewModel.cs
  modify:
    - DuetDiagram.App/MainWindow.axaml
    - DuetDiagram.App/Services/DiagramSession.cs
    - DuetDiagram.App/ViewModels/PropertyFieldCatalog.cs
    - DuetDiagram.Llm/Tools/ActionDispatch.cs
