  - "**缺省页要有明确口径。** 没声明归属的元素属于哪一页，要在校验与渲染两处用同一个判据；两处不一致的表现是「翻页之后有几个元素赖着不走」"
  - "**归属进结构哈希。** 换页会改变这一页里有什么，也就改变这一页的布局结果——报成外观变更的话，翻页之后不重排"
  - "**删页不是删元素。** 删掉一页之后那一页上的元素要么一并删、要么回到缺省页，两条路都行，但**必须在命令清单里写清是哪一条**，且撤销要能整份还原"
  - "`diagram_read` 与 `diagram_export` 的 `pageId` 参数现在返回结构化「还没接上」，这一条之后不许再返回它"
  - "新增的字段要在 `FieldRegistry` 里登记，否则属性面板与 `set-node-field` 都够不着它"
