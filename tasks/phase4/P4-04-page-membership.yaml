scope_note: |
  **这一条同时动了 IR、渲染与界面，因为它们本来就是一件事。** 只加归属字段不改渲染，
  翻页没有效果；只做标签栏不加归属，翻页之后画布上什么都不会变。三条一起才是一条能验的判据。

  **多页的「视口」这一轮不做。** 每页各自记住缩放与平移位置是常见的做法，但它要落到
  sidecar 还是文档里是个新决定，而方案没说。这一轮翻页沿用同一个视口，
  由这一条的侦察决定要不要记进 followups。

  **画布上的元素归属哪一页由命令决定，不由界面猜。** 在第二页上画一个节点，
  它归第二页——这件事走 `add-node` 的一个参数，而不是界面画完之后再补一条归属命令：
  两条命令的话，中间那一刻的文档是自相矛盾的。

reconnaissance: |
  **动手前对着 IR、字段表、哈希、布局请求、渲染、命令层与工具侧的三个 pageId 核了一遍，
  结论如下。**

  1. **缺省页的口径：第一页（按次序，次序相同用标识断并列）。** 没声明归属的元素、
     以及归属指向一个不存在的页面的元素，都归缺省页——与 P4-02 的缺省层同一形状。
     **这条规则只在 Core 里写一份**（`PageMembership`），布局、渲染、导出、摘要四处都调它。
     分成四份的话，"翻页之后有几个元素赖着不走"这类不一致迟早会出现，
     而那时四处各自都自洽。

  2. **删页的语义选「退回缺省页」，不是「一并删元素」。** 约束里说两条路都行、但必须写清。
     选这条的理由：与归属悬空那条先例一致（按缺省处理），而 `DeletePageCommand`
     一个字段都不用改；"一并删"要多记一批元素的 memento，且删除是不可逆方向的操作，
     而用户点"删页"时想的多半是"这一页不要了"，不是"把这一页上的东西也删了"。
     在 `docs/Command-List.md` 的页面那几行写清。

  3. **翻页要过布局，不只是渲染。** 所以 `page` 字段的作用域是 `Structural`
     （进结构哈希、报结构变更）：只滤渲染的话，别的页面上的节点照样在布局里占位置，
     翻页之后当前页的坐标会跟着别页的内容变，而用户看到的是"我翻一页图就重排了"。
     过滤因此要在 `LayoutRequestFactory.FromDocument` 里就发生。

  4. **过滤只有一处实现，两个消费点共用。** `LayoutRequestFactory`（布局）与
     `SceneBuilder`（绘制列表）各需要一个"这一页上有谁"的答案，两处各判一次的话，
     布局算的位置与画出来的东西会分叉——表现是元素画在别处或者漏画。
     形状照 P4-02 的 `LayerPlan`：算一次、查多次。

  5. **当前页是会话的状态，不进 IR。** `CurrentPageId` 活在 `DiagramSession` 上，
     翻页 = 换它 + `Reload()`。与"当前图层"同一口径：它不进任何哈希，撤销也回不到
     "上一次看的那一页"——撤销该撤的是对文档做的事，而翻一页什么都没做。

  6. **`add-node` 不用改签名。** 它收的是整个 `NodeDef`，所以"画在第二页上"就是
     `NodeDef.Page` 填上第二页。界面把当前页填进新节点即可（会话生成节点时填）。
     边的归属同理：`connect-edge` 收整个 `EdgeDef`。**但端点跨页的边要有个说法**：
     端点不在同一页时按"两端都在同一页才算这一页的边"处理，也就是这种边两页都不画
     ——约束里点名的那件事（一条边在两页上都画出来）正是要避免的。

  7. **工具侧的三个 `pageId` 一起接上**：`diagram_read`、`diagram_export` 的
     "还没接上"这一条之后不许再返回；导出按页过滤。`Category=ToolDispatch`
     与导出那几条用例会核。

  8. **校验器不补「指向不存在的页面」。** 与图层同一口径：悬空引用按缺省页处理，
     渲染只需要别崩。记进 followups。

  9. **属性面板那一格归属仍然隐藏**，入口在标签栏上（与图层归属的处置一致），
     所以这次不用再动分节——`FieldRegistry` 里登记、描述表里写清为什么不显示即可。

  10. **标签栏的位置**：画布那一格的最上面（`Grid` 里画布之上，停靠画布那一行的顶部），
      不进 DockPanel 的停靠位——停靠会改画布尺寸，而画布一改尺寸视口就跟着跳，
      开一次栏位图就挪一下。这一条与诊断面板、变更边栏同一条理由。

result: |
  **翻页换的是一整批元素。** 元素归哪一页进了 IR（节点的 `page` 与边的 `page`，都在结构哈希里），
  布局按页过滤，绘制列表按页过滤，界面上多了一条常驻的标签栏。

  **落地了什么**

  - `DuetDiagram.Core/Model/PageMembership.cs`（新建）：缺省页、元素实际归哪一页、
    这一页上画不画某个节点/某条边、以及把一份文档投影成"只有这一页"。
    布局、渲染、导出、摘要四处都调它，判据只有一份。
  - `NodeDef.Page` 与 `EdgeDef.Page`（**结构哈希**：布局按页算，换了页坐标就变）。
    `NodeDef` 的相等性与 `GetHashCode` 是手写的，两个都要同步补上——
    漏掉它俩的表现是"改了归属却报空操作"（记录自动生成的相等性管不到手写的那一份）。
  - `FieldRegistry` 加 `page`（节点与边各一条，作用域结构），`NodeFieldValue` /
    `EdgeFieldValue` 加读写分支；属性面板的描述表里加一条隐藏说明（入口在标签栏上）。
  - `LayoutRequestFactory.FromDocument` 与 `SceneBuilder.Build` 各加一个页参数：
    布局只把这一页的节点与边交给引擎（组合的成员也按页裁），
    渲染只给这一页的元素出笔；不在这一页上的节点并进 `DrawList.Blocked`——
    与图层那一条同一个理由，让那份名单单独就能回答"谁能被点中"。
  - `DiagramSession`：`CurrentPageId`、`SwitchPage`、`CreatePage`、`DeletePage`、
    `NextPageId`，以及 `SyncCurrentPage`（当前页没了就回缺省页）。
    选中集合的筛选加了页这一条（全选因此只收当前页的元素），
    新连出来的边填当前页。
  - `PageTabsViewModel` + `PageTabViewModel` + `Controls/PageTabs.axaml(.cs)`（新建）：
    一格一页、右端是当前页的名字与元素个数、新建与删页。标签栏停在画布那一格的最上面，
    常驻，与图层面板同一条理由（不进停靠位）。
  - `diagram_read` / `diagram_export` 的 `pageId` 接上：按页过滤，
    点一个不存在的页面时如实拒绝（`PAGE_MISSING`）——与元素上那个归属字段刻意不同，
    那一处按缺省页处理是文档内部的引用，这一处点的是调用方要的东西。
  - 文档：`IR-Schema.md` 的字段表与哈希覆盖、`Command-List.md` 的删页语义、
    `GUI.md` 的标签栏与「翻页换的是一整批元素」一节、`Render-Pipeline.md` 的层叠那一段、
    `AGENTS.md` / `README.md` / `tasks/README.md`。
  - 用例：Core `PageMembershipTests` 17 条、Layout 3 条、Render `PageRenderTests` 6 条、
    E2E `PageTabsTests` 10 条；Llm 那边把两条"还没接上"改成了按页过滤的判据。

  **两处与侦察时不一样的地方**

  - **边"没声明归属时跟着两端走"。** 侦察里定的是"边自己的归属要匹配、没声明就按缺省页"。
    落地时发现那条规则有个洞：两端都在第二页、而边没声明归属时，它归缺省页，
    于是两页都不画它——一条两端都在、却哪儿都看不见的边。改成跟着两端走，
    而"两端不在同一页时哪一页都不画"照旧。`EdgeDef.Page` 的注释与 IR 文档都写清了这一条。
  - **验收里那条 `Category=ToolDispatch` 落在了 Mcp.Tests 上，而它其实在 Llm.Tests 上**
    （那条分类管的是四个动作工具的动作表）。按实际改成 `Category=ExportTool`
    与 `Category=ContextSummary` 两条。工具侧那两条动作表门禁仍然在跑，见下。

  **一个刻意的取舍**

  - **删页退回缺省页，不删元素。** 见上面的侦察。`DeletePageCommand` 一个字段都没改。
  - **页面的重命名与挪次序不做**：没有命令，而标签栏这一轮不需要它们。
  - **每页各自的视口不做**，"从界面上新建节点"也没有（人这边建不出节点，
    所以"新元素归到当前页"暂时没有落点）。两条都记进了 `docs/GUI.md` 的缺口表。

  **门禁**

  - `dotnet build DuetDiagram.slnx -c Release`：0 警告 0 错误。
  - 四条验收：`Category=PageMembership` 17/17、`Category=MementoRegistration` 10/10、
    `Category=PageTabs` 10/10、`Category=ExportTool` 11/11；另加
    `Category=ContextSummary` 22/22、`Category=PageRender` 6/6、`Category=ToolDispatch` 18/18。
  - 全量测试：Core 496 / Layout 78 / Render 165 / Mermaid 179 / Dsl 158 / Llm 192 /
    Mcp 109 / E2E 123 全绿。
  - `Category=MultiAgent` 通过；`tools/McpHarness -- protocol` 8/8 通过；
    `tools/LocCounter --root . --check` 退出码 0
    （`reports/loc.md` 已重新生成：408 个文件 / 87122 行 / 54477 行代码）。

  **后续**

  - 页面归属与端点不一致的边（声明了另一页而两端不在）校验器不报，补一条记进 followups。
  - 每页的视口、页面的改名与挪次序、从界面上新建节点（填当前页）。
