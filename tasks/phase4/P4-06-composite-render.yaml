  **后续**

  - 子流程的展开／折叠交互（点标记、成员进退布局）。
  - 组合的属性编辑（命名、成员管理）——面板现在只报名字。
  - P4-05 记下的「建完组合选中新组合」现在**可以成立**了（组合已可选），
    那一条在组合属性编辑落地时一起做。
