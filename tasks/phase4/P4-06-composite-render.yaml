scope_note: |
  **组合在画布上现在是隐形的。** 命令能建、校验会管、布局引擎按嵌套关系排，
  但画面上什么都看不到——成员只是各自画各自的。这一条让组合可见、可点、可拖。

  **「组合全部可用」这条判据由两条任务合起来满足**：P4-05 给入口（建、解散、移入），
  这一条给呈现与操作（看得见、点得中、拖得动）。两条都落地之后，
  §14.3 的 Phase 4 判据第二条才算有人验。

result: |
  **组合从"模型里有、画面上没有"变成看得见、点得中、拖得动。**
  P4-05 给了建的入口，这一条给呈现与操作；两条合起来，§14.3「组合全部可用」才有人验。

  **落地了什么**

  - `DuetDiagram.Render/CompositeFrame.cs`：一个组合的框。四种形态各有一套**几何**记号，
    不靠颜色——分组实线圆角框加标题带；泳道直角框加顺着流向那一侧的池头带与指向流向的
    箭头；子流程双线框加右上角展开／折叠标记（折起来是加号）；组合框虚线。
    组合框按约束原文是「按普通节点画」，但那样与分组分不开，而同一段约束的第一句正是
    「四种形态一眼分得开，且不靠颜色」——两句打架时按第一句办，画虚线。
  - `SceneBuilder.AppendComposites` 改走 CompositeFrame；框仍在成员下面（外层在前）。
  - 选中这一格接上：`SetSelection` 接受组合（门槛只有"文档里存在"，组合没有自己的
    图层与页面）、`SelectedComposites`、点组合框选中的是组合本身（命中测试从层叠顶端
    往下找，成员的指令在框之上，天然成立）。
  - 拖动：`BeginDrag` 认组合，把选中整批里的组合**展开成成员节点**（嵌套递归、去重、
    保序），之后照旧走 DragSession / DragController——那两边消费的本来就是节点标识，
    一行没改。空组合没有可拖的东西，按下只选中。
  - 删除选中的组合如实拒绝：删它有两种读法（成员跟着删 / 只拆这一层），两种都不好，
    前者会删掉用户没打算删的东西，后者与「解散这一组」重复。提示语把两条路都指出来。
  - 属性面板标题承认组合（`组合 <id>`），字段一节照旧收起——组合没有字段表。
  - 框选不收组合：框到成员必然同时碰到组合的框，收进来等于把它全部成员都拖走。
    与「全选不收组合」同一口径。组合由点框选中。
  - 用例：`CompositeFrameTests` 6 条（Category=CompositeFrame）、
    E2E `CompositeDragTests` 3 条拖动（Category=Composite）+ 3 条命中（Category=HitTest），
    全部走真实指针手势，坐标从绘制列表反推。

  **与任务清单不一样的地方**

  - `CompositeFrame.cs` 落在 `DuetDiagram.Render/` 根上，不是 `Render/Composites/` 子目录
    ——单个文件不值得开一层目录。
  - `DrawCommand.cs` 与画布、`DragSession` / `DragController` 都没有改：
    组合的框由现有指令拼出（形状 + 折线），拖动展开成成员后走的还是原路径。
  - 快照 `07-lane` 有意更新：泳道从圆角框改为直角框并多出池头箭头，
    正是本条要的形态变化，逐字节对比确认只有这两处。

  **刻意的取舍**

  - **折叠只画标记。** `Collapsed` 在结构哈希里（P3 已定），展开与折叠会触发重布局，
    而成员不进布局、点标记切换状态，是独立的交互——按任务约束留给后续。
  - **点组合框 = 按下即拖全部成员**，与点节点同一条 P2-06 规则；
    代价是点一下会把成员固定在原地（点节点也一样），撤销一步即可。
    写进了 `docs/Render-Pipeline.md`，连同「组合没有坐标，拖组合改的是成员的固定位置」。

