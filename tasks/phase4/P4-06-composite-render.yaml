  - "**拖动的落点判据与 P2-06 一致**：重叠固定节点被挡下、整次拖拽算一步撤销"
  - "**组合的坐标从哪来要核。** 组合本身没有坐标字段，框的大小与位置由成员算出来——那么「拖组合」实际改的是全部成员的固定位置。这一点必须在 `docs/Render-Pipeline.md` 里写明，否则下一个人会去找一个不存在的组合坐标"
  - "折叠状态（`Collapsed`）在结构哈希里，展开与折叠要触发重布局——这一条只做绘制与命中，展开折叠的交互留 followups"
context:
