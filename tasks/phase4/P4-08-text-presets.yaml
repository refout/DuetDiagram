estimated_loc: 400
files:
  create:
    - DuetDiagram.Core/Commands/Builtin/DefineTextPresetCommand.cs
    - DuetDiagram.Core/Commands/Builtin/UpdateTextPresetCommand.cs
    - DuetDiagram.Core/Commands/Builtin/RemoveTextPresetCommand.cs
    - DuetDiagram.Core/Commands/Builtin/ApplyTextPresetCommand.cs
