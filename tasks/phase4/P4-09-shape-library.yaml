acceptance:
  - command: dotnet test --project DuetDiagram.Core.Tests/DuetDiagram.Core.Tests.csproj -- --filter-trait "Category=ShapeRegistry"
    expect: 全通过；注册表里八个内置形状齐，名字与枚举逐条对得上，重复注册被拒
  - command: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -- --filter-trait "Category=ShapeProvider"
    expect: 全通过；每个形状的几何由提供者给出，渲染层按几何画而不是按枚举分支
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -- --filter-trait "Category=ShapeLibrary"
