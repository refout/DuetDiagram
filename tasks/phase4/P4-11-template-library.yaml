constraints:
  - "**模板的标识冲突要消解，不许直接拼。** 模板里的节点标识在目标文档里可能已经存在；不消解的话拼出来的文档有两套同名标识，而校验器报错的位置离肇事的那一步很远"
  - "**实例化是一条命令，不是一串命令。** 拼进去十个节点如果发十条命令，撤销要按十次，而用户眼里是一次「放了一个模板」"
  - "**失败整体回滚。** 与所有命令同一条口径：模板里有一处非法就整体不落，不留半个模板在文档里"
  - "**模板文件是文档片段，不是第二套 IR。** 它复用 `DiagramSerializer` 那套格式，只是少几个集合。另造一套格式的话，IR 每加一个字段就有两个地方要改"
  - "**模板目录的路径要能注入。** 写死一个相对路径的话，装好之后运行目录一变就找不到了——而症状是「模板列表是空的」，没有任何报错"
  - "**模板不带页面归属。** 带了的话，放进第二页的东西会被模板带回第一页"
  - "**模板文件随程序集走要显式声明。** 构建输出里没有它的话，开发机上一切正常、发布之后模板列表是空的"
context:
  - 方案 §13.8 的「模板」与 §14.3 的「图层/页面/形状库/模板可用」
  - "`DuetDiagram.Core/Serialization/` 是模板文件该复用的那套序列化"
