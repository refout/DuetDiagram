files:
  create:
    - DuetDiagram.Render/RichTextLayout.cs
  modify:
    - DuetDiagram.Render/TextLayout.cs
    - DuetDiagram.Render/ITextMeasurer.cs
    - DuetDiagram.Render/SkiaTextMeasurer.cs
    - DuetDiagram.Render/SceneBuilder.cs
