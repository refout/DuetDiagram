constraints:
  - "**排版必须确定性。** 同一个内容与同一份字体度量每次排出逐字相同的结果——用哈希做缓存键的地方全靠这一条，不确定的话视觉哈希会抖"
  - "**折行不许把单词切断。** 一个词比整行还长时才许硬切。切错的表现是「英文单词中间断行」，而中文按字断行是正常的，两者要分开判"
  - "**行高取行内最高的那个 run。** 取平均或取第一个的话，混排大字号的那一行会与下一行叠在一起"
  - "**节点尺寸由排版结果算，不许按字符数估。** 估算的表现是「有的节点文字溢出、有的留一大片空白」，而两种在画面上都不报错"
  - "**`TextLayout` 现在的口径是「只认真正的换行符、不做自动折行」，这一条要扩它而不是另写一份。** 另写一份的话，纯文本与富文本会走两条排版路径，而两条的边距与对齐必然对不上"
  - "**度量接口要保持可注入。** 测试要用假度量（`FakeTextMeasurer`），真实现要能换——写死 Skia 的话，排版用例就跑不了"
