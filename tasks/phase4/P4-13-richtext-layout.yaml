  **后续**

  - 编辑界面（P4-14）还没做：内容能排能画，但人还没有改分段与行内样式的入口。
  - 折行宽度目前只有调用方能给；节点按内容量尺寸、不设上限，所以长段落会撑出很宽的节点。
    要让节点自己折行得先定一个最小宽度再迭代，那是另一件事。
  - 竖排与双向文字没做，与 Phase 5 的 i18n 那一条接上。
  - 数学排版（P4-15）在内容模型之上做，与富文本是两条排版路径。
