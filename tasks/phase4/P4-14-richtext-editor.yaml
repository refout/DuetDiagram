  - "**退出即提交，除非明确取消。** Esc 取消、点别处提交——两条路都要在用例里，因为它们的差别正是「我的改动去哪了」这个问题"
  - "**编辑控件不许直接改文档。** 它改的是会话里的草稿，提交那一步才走命令层；直接改的话，只读门与版本检查都被绕过"
  - "**样式按钮的作用对象是选区，不是整个标签。** 没有选区时作用于随后输入的文字。作用于整个标签的话，用户想加粗一个词却整段变粗"
  - "**这一轮只做六项行内样式**（粗体、斜体、下划线、删除线、字号、颜色），不做段落级对齐与列表。做全的话，编辑控件会长成一个独立的富文本编辑器，而它要维护的每一件事都与画布的排版重复一遍"
  - "**编辑期间画布要停止重排。** 每敲一个字重排一次的话，节点边框会随着打字跳来跳去，而用户正在看的就是那一块"
  - "**中文输入法要能正常用。** 组合输入（拼音候选）期间不许提交中间态——把拼音字母写进文档的话，用户得自己删掉"
