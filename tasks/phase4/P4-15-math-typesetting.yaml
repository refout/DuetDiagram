constraints:
  - "**支持的语法边界要写进文档并由用例守住。** 一个「大部分能画」的排版器比一个「只支持十二种记号」的排版器危险得多：前者画错的时候看起来像画对了"
  - "**认不出的输入给结构化错误，不许原样画出来。** 原样画的话，用户看到的是一串花括号，而他以为是自己语法写错了"
  - "**行内与独立成行的基线处理不同**，`MathMode` 分这两档就是为了这件事。行内要与周围文字对齐，独立成行要单独占一块并居中——两档用同一套处理的话，行内公式会把整行文字顶起来"
  - "**先选型再写代码。** 依赖清单里现在没有排版库，而仓库约定「不引入未在选型清单中的依赖」。侦察要核三件事：候选库在原生编译下能不能用、体积与许可证、它支持到哪一档语法。核不出来就自己写一个最小子集，并把边界如实写进文档"
  - "**排版结果要确定性**，与 P4-13 同一条口径"
  - "**Mermaid 导出把数学模式列进丢失清单**（那份清单里已经有它，这一条之后要把「有数学内容」也算进丢失统计，而不只是字段非空）"
  - "**公式的度量走 `ITextMeasurer` 那条路**，不要另起一套字体加载——两套字体栈的表现是「公式里的字与旁边的字不是同一个字体」"
