  - "**导出是确定性的**：同一份绘制列表与同一组选项导出两次逐像素相同。Skia 的某些抗锯齿开关在不同机器上不一致，这一条要在侦察里核实"
  - "**导出是只读的，不进命令总线**，与 `diagram_export` 现有口径一致"
context:
  - 方案 §三 架构里「渲染层包含导出（SVG/PNG/PDF）」
  - "`DuetDiagram.Render/SkiaTextMeasurer.cs` 说明渲染层本来就依赖 SkiaSharp，无头光栅化不需要窗口平台"
  - "`DuetDiagram.App/SelfTest.cs` 现在自己脱屏渲染一帧存 PNG，这一条之后应该改走同一个导出器"
