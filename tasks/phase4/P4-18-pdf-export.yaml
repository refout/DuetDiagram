acceptance:
  - command: dotnet test --project DuetDiagram.Render.Tests/DuetDiagram.Render.Tests.csproj -- --filter-trait "Category=PdfExport"
    expect: 全通过；页尺寸、多页、矢量与位图两条路的取舍各有用例
  - command: dotnet test --project DuetDiagram.Llm.Tests/DuetDiagram.Llm.Tests.csproj -- --filter-trait "Category=ExportTool"
    expect: 全通过；`diagram_export` 的 `pdf` 不再返回「还没接上」
