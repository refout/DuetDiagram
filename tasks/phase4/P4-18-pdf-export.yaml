id: P4-18
title: PDF 导出——选型验证与落地
phase: 4
status: done
depends_on: [P4-17]
estimated_loc: 480
files:
  create:
    - DuetDiagram.Render/Export/PdfExporter.cs
    - reports/phase4-pdf.md
  modify:
    - DuetDiagram.Render/DuetDiagram.Render.csproj
    - Directory.Packages.props
    - DuetDiagram.Llm/Tools/ExportTool.cs
    - DuetDiagram.App/Services/MenuRegistry.cs
