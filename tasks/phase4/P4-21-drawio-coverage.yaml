id: P4-21
title: draw.io 覆盖率取证
phase: 4
status: done
depends_on: [P4-06, P4-11, P4-15, P4-18, P4-19]
estimated_loc: 420
files:
  create:
    - reports/phase4-drawio-coverage.md
    - tools/CoverageAudit/Program.cs
    - tools/CoverageAudit/CoverageAudit.csproj
    - tools/CoverageAudit/Matrix.cs
  modify:
    - AGENTS.md
    - tasks/README.md
    - README.md
acceptance:
  - command: dotnet run --project tools/CoverageAudit -c Release
    expect: 退出码 0，印出「有 / 部分 / 无」三档的逐条计数与总数，覆盖率 ≥ 85%
  - command: dotnet run --project tools/CoverageAudit -c Release -- --list missing
    expect: 退出码 0，列出全部记成「无」的条目，每条带一句为什么（没做 / 做不到 / 方案没要求）
  - command: python -c "import yaml,glob; [yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('tasks/**/*.yaml',recursive=True)]; print('ok')"
    expect: 输出 ok；清单里每一条引用的任务编号都真实存在
constraints:
  - "**覆盖率的分母要写死在装置里，且逐条可追。** 分母凭印象取的话，这个数字想变成多少就能变成多少——而它是 Phase 4 的唯一一条量化判据"
  - "**每一条要么指向一份证据（文件与命令），要么指向一句为什么没做。** 只写「已支持」的话，读的人无从复核，而复核正是这份报告存在的理由"
  - "**「部分」要拆开写清楚缺的是哪一半。** 写成一个「部分」的档，等于把「缺一半」与「缺一个边角」混在一起——两者的代价差一个数量级"
  - "**清单不许只列本仓已经做了的东西。** 分母要来自 draw.io 的实际能力面（它的形状、连线、容器、文本、导出格式这几档），否则覆盖率是一个自我实现的数字"
  - "**分母里要注明来源与取的时间。** draw.io 自己也在变；不注明的话，下一轮复核时没人知道该跟哪个版本比"
  - "**装置不进 sln**（与 `tools/LocCounter`、`tools/CompareHarness` 同一条口径）"
context:
  - 方案 §14.3 的「Phase 4：draw.io 覆盖 ≥ 85%」
  - "`tools/LocCounter` 是不进 sln 的调查工具的现成形状"
  - "`reports/compare-blind/` 是「结论与证据分成两份」的先例"
  - "`docs/Compare-Criteria.md` 是判据该长什么样的先例"
scope_note: |
  **这一条是 Phase 4 唯一一条量化判据的出口。** 别的判据（组合可用、富文本正确、
  导入导出无损）都有各自的用例；「draw.io 覆盖 ≥ 85%」没有，它需要一个清单与一个计数。
  而覆盖率这种数字最容易变成一句自说自话——所以这一条的产物里，
  **装置本身比数字重要**：换一个人跑同一个装置，应该得到同一个数。

  **「无」的那一档不是失败，是交付物。** 覆盖率 85% 意味着有 15% 明确不做，
  而那 15% 是什么、为什么不做，是这份报告里最有用的一段——
  它同时是 Phase 5 的输入（打磨阶段要补哪些）。

result: |
  **结论：覆盖率 86.3%，达到方案 §14.3「draw.io 覆盖 ≥ 85%」判据；分母 117 条来自 draw.io
  公开能力面，每一条带证据或理由。**

  **装置本身比数字重要。** `tools/CoverageAudit` 不进 `DuetDiagram.slnx`（与 `tools/LocCounter`、
  `tools/CompareHarness` 同口径），分母与每条判定写死在 `Matrix.cs`。覆盖率定义为
  「（有 + 部分）/ 总数」= (88 + 13) / 117 = **86.3%**；另报加权口径（有 + 0.5×部分）= 80.8%，
  不混入主数。换一个人跑同一个装置应得到同一个数——这是这一条存在的理由。

  **分母来自 draw.io 真实能力面，不自我实现。** 按下述几档取：形状 / 连线 / 容器 / 文本 /
  导出格式 / 布局 / 编辑交互 / 画布与页面 / 协作与版本 / 面板与工具栏。取数时间 2026-09，
  来源在 `Matrix.cs` 的 `Source` 常量里逐字写死。每条「有 / 部分」指向一份证据（仓库文件 +
  可复跑命令）；装置顺带核对证据文件是否真在仓库里，本轮 0 条缺失。每条「无」写明为什么不做。

  **判定口径（与任务约束一致）。** 部分必须拆开写缺哪一半（如「连线自动避让路由」只到布局正交走线，
  拖拽实时绕障未做）；清单不只列本仓已做的（刻意纳入 draw.io 真实能力面里本仓没做的那一档，
  否则覆盖率是自我实现的数）；分母注明来源与取数时间。

  **16 条「无」是交付物，不是失败。** 其中 draw.io XML 的读与写是「刻意不做」——本仓有自己的
  IR 与 DSL，去兼容 draw.io 私有 XML 是另一份工程量；DSL 导入卡在决策门 1；其余是 P4-14 等遗留
  或方案未要求。那一段是 Phase 5 打磨的输入（列表、渐变/阴影、图片嵌入、draw.io 格式互通最值得补）。

  **门禁（全部通过）。** `dotnet run --project tools/CoverageAudit -c Release` 退出码 0，印出
  覆盖率 86.3% 与逐档计数；`--list-missing` 退出码 0，列出 16 条「无」带理由。
  `python -c "import yaml, glob; ..."` 校验所有任务 YAML 可解析（编号真实存在）通过。

  **与任务清单的出入。**
  1. 计划里 `modify` 列了 `MenuRegistry.cs`、`MermaidImporter.cs`，本条实际没动它们：菜单条目
     落在 `MenuEntries.cs`（与注册表同一套）；`MermaidImporter` 本就在，只是第一次从生产代码调到它。
  2. 分母比「本仓已做之事」宽：这是约束要求的（否则数字自我实现），不是把判据放宽。
  3. 覆盖率数字靠装置算出来，不靠手改；后续每条增删由装置重新得出。

  **后续。** 详见 `reports/phase4-drawio-coverage.md`（结论与证据分两份）。Phase 5 打磨阶段优先补
  列表（P4-14 已欠）、渐变/阴影、图片嵌入；draw.io 格式互通若决定做要另开一条兼容线。

