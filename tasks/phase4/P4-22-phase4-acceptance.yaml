acceptance:
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -- --filter-trait "Category=Phase4Scenario"
    expect: 全通过；§14.4 那条「导入 500 节点 Mermaid，渲染 < 2s，可交互」与「导出 SVG 给同事打开」两条场景各有一条端到端用例
  - command: dotnet run --project tools/CoverageAudit -c Release
    expect: 退出码 0，覆盖率 ≥ 85%，四条判据逐条指向证据
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误
  - command: dotnet run --project tools/LocCounter -c Release -- --root "$PWD" --check
    expect: 退出码 0；`reports/loc.md` 与代码一致
  - command: dotnet publish DuetDiagram.App/DuetDiagram.App.csproj -c Release
    expect: 退出码 0；Phase 4 加进来的东西没有破坏原生发布（界面程序这一条在带 C++ 工具链的机器上跑）
constraints:
  - "**四条判据逐条指向证据，不许只写「已通过」。** 组合全部可用、图层/页面/形状库/模板可用、富文本与数学正确、导入导出无损——每一条要给出验它的是哪个命令或哪份报告"
  - "**报告里要写明哪几条只有自建用例、没有真人用过。** 与 P1-14 的人工评分、P2-13 的真人数据、P3-16 的真实代理同一类：装置齐了不等于测过了"
  - "**跨机器与跨平台没做的那几条要如实列**（原生发布只在带 C++ 工具链的机器上验过、PDF 若选了位图嵌入则「矢量」那条没验）。写进遗留，不写成通过"
  - "**CI 要把 Phase 4 新增的门禁补上。** 新增的分类（形状库、模板、富文本、数学、导出、导入、图层面板、页面标签）要单列成步骤——只加测试工程的话，它们退化了不会让别的测试变红"
  - "**端到端用例要跑真的窗口。** 与 Phase 2 那批同一口径：无头模式下起窗口、送输入、抓一帧"
context:
  - 方案 §14.3 的 Phase 4 四条判据与 §14.4 的端到端场景
  - "`reports/phase3-mcp.md` 是「逐条判据 + 谁验的 + 遗留」这份格式的先例"
  - "`.github/workflows/ci.yml` 的 `app-and-aot` 那一组要跑窗口与原生发布"
  - "`DuetDiagram.E2E.Tests/HeadlessFixture.cs` 是起窗口那套装置"
scope_note: |
  **这一条核的是「四条判据在这套实现上到底有没有出口」，与 P3-16 同一条口径。**
  没有出口的那一条要如实记成「没出口」，并说清是「做不了」还是「没做」——
  P3-16 里那个 `accepted=false` 就是这样记下来的，那一份记录比一句「已通过」有用得多。

  **Phase 5 的任务 YAML 由这一条结束时产出**（方案 §13.6 的约定）。
  所以这一条还要顺带看一眼：Phase 5 的六条判据（布局评分、1000 节点流畅、内存、
  冷启动、无障碍、i18n）在这套实现上各需要什么前置，哪些已经被 Phase 4 顺带做了。

result: |
  **四条判据逐条指向证据（详见 `reports/phase4.md`）：**

  1. draw.io 覆盖 ≥ 85% → P4-21 的 `tools/CoverageAudit`：本轮 86.3%（有 88 / 部分 13 / 无 16，共 117），加权 80.8%。分母写死在 `Matrix.cs`，来自 draw.io 公开能力面，每条带证据或理由。这是一份自审计，不是人的判断。
  2. 组合全部可用 → P4-05 + P4-06：框选右键建四类组合各一条端到端用例；`Category=Composite`（17）/ `CompositeTool`（13）/ `CompositeFrame`（6）/ `CompositeDrag`（E2E）守着。
  3. 图层/页面/形状库/模板可用 → P4-02/03/04/09/10/11：六类各有一组分类门禁（`LayerPanel` 15、`LayerVisibility` 8、`PageTabs` 10、`PageMembership` 17、`ShapeLibrary` 5、`ShapeRegistry` 7、`PathShape` 27、`Template` 36 等），CI 已单列成步骤。
  4. 富文本与数学正确 → P4-12~15：`RichText` 31、`RichTextLayout` 18、`RichTextEditor` 7、`TextPreset` 16、`MathTypesetting` 18 等；数学边界是「清单外一律结构化错误」而非「画得对」。
  5. 导入导出无损 → P4-16~19：`SvgExport` 13、`BitmapExport` 24、`PdfExport` 22、`RoundTrip` 11、`Import`（Core 27 + E2E 15）、`MermaidImport` 27 等；两条 L3 端到端场景各有 `Category=Phase4Scenario` 用例（导入 500 节点渲染 < 2s 且可点击；导出 SVG 合法、带 viewBox、每条指令都落成一个元素）。

  **只有自建用例、没有真人用过的那几条：** 四条判据（组合、图层/页面/形状库/模板、富文本/数学、导入导出）目前**全部**是自建用例验的，没有任何一条是真人通过 GUI 实际用过的——没人框选建过组合、没人从形状库拖过形状、没人套过模板翻过页、没人敲过富文本写过分式、没人真的导入自己的 Mermaid、没人真的把图导出去给同事。与 P1-14 / P2-13 / P3-16 同一类：装置齐了不等于测过了。

  **跨机器与跨平台没做（如实列，不写成通过）：**
  - 原生发布（`dotnet publish DuetDiagram.App`）在本机停在 `Platform linker not found`（缺 MSVC C++ workload，与 P0-02 同一处），所以「导出的 PDF 库在原生编译后可用」这条判据的落点没跑成；界面程序原生发布同理，CI 的 app-and-aot 只在带 C++ 工具链的运行器上才真跑得通。
  - PDF 若改走位图嵌入支线，那一档的「矢量」没验（选型默认走 SkiaSharp 矢量写入器）。
  - GUI 全部在 Windows 验，Linux/macOS 没人起过窗口；跨平台字体回退与渲染后端没验。
  - 界面上的导出对话框仍是占位（P4-16 已知），「导出 SVG」那条端到端走的是与界面同一份绘制列表的管线（直接 `SvgExporter` 消费窗口 DrawList），没点开导出对话框。

  **门禁补上了：** CI 的 `build-and-test` 新增「Phase 4 门禁」一步，把形状库/模板/富文本/数学/导出/导入/图层/页面 15 个分类逐个 `--filter-trait` 跑；`app-and-aot` 新增「Phase 4 界面门禁」一步，把 `ShapeLibrary`/`RichTextEditor`/`LayerPanel`/`PageTabs`/`Import` 五个 E2E 分类单列。这些分类退化时不会让别的测试变红，所以之前缺这道。

  **Phase 5 任务 YAML 已产出**（`tasks/phase5/`，P5-01 ~ P5-07），见 `tasks/README.md` 的 DAG 与 DoD 映射表。六条 Phase 5 判据里四条能机验（布局评分、1000 节点流畅、内存、冷启动，各有装置）、两条要人（WCAG AA 的对比度与读屏体验、RTL 真人走查），后者在 P5 的报告里要如实记成「未验」。

  **本地门禁结果：** `dotnet build DuetDiagram.slnx -c Release` 0 警告 0 错误；E2E 全量 204/0（`Category=Phase4Scenario` 2/0）；15 个 Phase 4 分类门禁全过；`CoverageAudit` 86.3% 退出 0；`LocCounter --check` 退出 0。`dotnet publish DuetDiagram.App` 本机因缺 C++ 工具链未跑（记遗留，CI 的 app-and-aot 在带工具链运行器上跑）。
