id: P5-01
title: 布局质量评分装置与基准
phase: 5
status: done
depends_on: [P2-02, P2-11, P4-22]
estimated_loc: 360
files:
  create:
    - tools/LayoutScore/LayoutScore.csproj
    - tools/LayoutScore/Program.cs
    - tools/LayoutScore/Rubric.cs
    - tools/LayoutScore/Corpus.cs
    - reports/phase5-layout-score.md
acceptance:
  - command: dotnet run --project tools/LayoutScore -c Release
    expect: 退出码 0；在种子语料上给出综合质量分 ≥ 85，且逐条指标（重叠、交叉、紧凑度、方向一致）都可复现
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误
constraints:
  - "**评分口径要可复现、与主观评分对照。** 装置给的分要能追到具体指标与具体节点，换一个人跑同一个种子语料得到同一个数；同时要与一小批人工评分对照，差异超过阈值就记下来而不是掩盖"
  - "**不引人工判断进评分主路径。** 像 P4-21 的覆盖装置一样，装置本身比数字重要；评分维度写死在 Rubric.cs 里"
  - "**装置不进 sln**（与 tools/LocCounter、tools/CoverageAudit 同口径），但要用到布局引擎与一份种子语料"
context:
  - 方案 §14.3 的 Phase 5 判据「布局评分 ≥ 85」
  - "P2-02 的布局引擎与 P2-11 的布局失败处理已经落地，这一条量的是「算出来的图好不好看」而不是「算不算得出来」"
  - "对照基准取自 P1-14 / reports/compare-blind 那一套人工评分的可复跑框架"
result: |
  **结论：综合质量分 96.6，达到「布局评分 ≥ 85」判据，退出码 0。**
  装置落在 `tools/LayoutScore`（不进 sln），三份源文件加一份语料：
  `Program.cs`（跑布局、印分数与明细）、`Rubric.cs`（四个维度与权重）、`Corpus.cs`（种子语料）。
  它跑的是**产品里那份布局引擎**（`LayoutRequestFactory.FromDocument` → `LayoutJob.ToRequest`
  → `ConstraintLayoutEngine.Layout`），不是另抄一份。验报告 `reports/phase5-layout-score.md`。

  **四个维度都是量出来的，不是判出来的。** 重叠 = 互相压住的节点对 / 节点两两配对；
  交叉 = 互相穿过的边对 / 边两两配对，再乘上「折线穿过无关节点」那一项；
  紧凑度 = min(1, 参照外接框面积 / 实际外接框面积)；方向一致 = 前进边 / (前进边 + 后退边)。
  权重 0.30 / 0.30 / 0.20 / 0.20，综合分是加权平均。

  **两条口径上的取舍值得记。**
  1. **交叉只数真正的穿过**（交点落在两条线段各自的内部）。共线压在一起、T 形接上、
     共用一个端点都不算——本仓的路由正是在层间空隙里挑一个通道，同一层间的边共用那一条通道，
     把共线算成交叉会让每一份扇形图都掉到 50 分上下，而那是路由的标准走法，不是打结。
  2. **紧凑度的参照是「拿实际分出来的层、按请求间距重算最小外接框」**，不是「节点总面积」。
     用节点总面积的话，量到的是「这个图的形状密不密」——十二条分支的扇形图中间本来就空着
     一大片。层号不在布局结果里，由节点在主方向那个轴上的区间重叠聚类得到。

  **几何自检先验一遍判定本身。** 一个从没数出过东西的计数器不算验过：语料上跑出来交叉是零，
  那可能是引擎排得好，也可能是判定写反了。所以装置每次先拿六组手算得出的线段对验一遍
  （一组该判成穿过、五组不该），不过就退出码 2、一个分都不出。本轮 6 组全部通过。

  **一个发现：带环的图排不出来。** `cycle-4`（四节点环）在布局引擎里直接抛
  `DagreException: Cannot set a named edge when isMultigraph = false`——异常来自**去环**那一步
  （`Acyclic.Run` 要把成环的边反向，反向时给边起了名字，而这个 Dagre 封装的图没开多图模式）。
  也就是说只要图里有环，布局就整个失败，与环的大小位置无关。**这不是边角情形**：
  流程图上"重试"就是一条回边，本仓 DSL 语法文档里那段完整示例（`bad -> input "重试"`）
  就是一份带环的图。修它要动 `DuetDiagram.Layout/Internal/EngineAdapter.cs`，
  不在这一条范围内，如实记在报告里。

  装置对它的处置：单列在最前面、**不计入综合分**（"能不能排"与"排得好不好看"是两个问题，
  混在一起读的人从分数上看不出是哪一种），并加一道保险——排不出来的超过语料三分之一时
  不出分（退出码 2），免得一个只覆盖一小半语料的分数被当成结论。本轮 1/11 排不出来，
  综合分按剩下 10 份、按节点数加权。

  **与人工评分对照：未验。** 装置支持 `--ratings <路径>`（读一份「图标识 → 人工分」的 JSON，
  逐图印出装置与人的差、平均绝对差、几份的差超过 15 分），**但这一轮没有人给过分**，
  所以这一栏记成未验，不生成一份占位的对照。与用户测试、对比测试同一口径。

  **门禁（全部通过）。**
  - `dotnet run --project tools/LayoutScore -c Release` 退出码 0（综合分 96.6；简单平均 95.7，最低 91.8）。
  - Release 构建 0 警告 0 错误。
  - 八工程全绿、`Category=CommentDiscipline` 通过、`tools/LocCounter --check` 退出 0、自检退出 0。

  **与任务清单的出入。**
  1. 多了一份 `Corpus.cs`（语料）。语料与评分口径是两件事，放在同一个文件里会让"改语料"
     与"改判据"看起来是同一种改动，而它们的后果完全不同。
  2. 退出码除了 0 / 1，多了 2（装置自己不可信：几何自检没过，或排不出来的超过三分之一）。
  3. `--dump`（印某一份图的坐标与折线）与 `--ratings`（与人工评分对照）是卡里没写的两个开关。
  4. 语料 11 份里有 1 份排不出来（见上），而卡里的验收写的是"给出综合质量分 ≥ 85"——
     装置给得出，但那一份的失败是这一轮最值得记的东西。

