id: P5-03
title: 内存预算取证
phase: 5
status: done
depends_on: [P2-02, P2-03, P4-22]
estimated_loc: 220
files:
  create:
    - tools/MemBudget/MemBudget.csproj
    - tools/MemBudget/Program.cs
    - reports/phase5-memory.md
  modify:
    - tasks/README.md
    - AGENTS.md
acceptance:
  - command: dotnet run --project tools/MemBudget -c Release
    expect: 退出码 0；载入大文档 + 1000 节点场景的峰值工作集 < 500MB，逐档内存都列在报告里
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误
constraints:
  - "**量的必须是真实工作集，不是 GC 的已提交字节。** 用进程级的工作集读数（或 dotnet 的 GC 总内存），并且要说明测量时机（稳态、载入后、滚动后）"
  - "**与渲染/序列化各自的内存坑对照。** 重点核 P2-03 的四叉树与 P1 的版本日志环形缓冲是否真的有界，而不是只看总数好看"
  - "**装置不进 sln**（与 LayoutScore、CoverageAudit 同口径）"
context:
  - 方案 §14.3 的 Phase 5 判据「内存 < 500MB」
  - "P1 的 VersionLog 限制 100 条 + IsBulkChange，P2-03 的视口索引是有界的，但都没有一份独立的取证把「大文档下到底占多少」数出来"
  - "这一条与 P5-02 共用 1000 节点场景的语料与载入方式"
result: |
  **结论：峰值工作集 139.1 ~ 141.5 MB，达到「内存 < 500MB」判据，退出码 0，余量 3.5 倍。**
  装置落在 `tools/MemBudget`（不进 sln），两份源文件；它跑的是产品那条链路
  （`DiagramSerializer` → `SceneComposer.Compose` → `CullingIndex`），不是另抄一份。
  验报告 `reports/phase5-memory.md`。

  **量的是进程工作集（`Environment.WorkingSet`），不是 GC 的已提交字节。**
  后者只说明托管堆要了多少地址空间，既不含原生字体与布局引擎的内部结构，
  也不说明那些页有没有真的落在物理内存里。`GC.GetTotalMemory` 只在核有界性时用，两个数分开列。
  峰值靠一条 2 毫秒间隔的后台线程采样，不靠操作前后各读一次——峰值出现在操作中途。

  **逐档增量，不比绝对值。** 每档开始前强制回收一次让基线可比，
  判据读的是「这一档把进程推到多高」而不是「新分配了多少」——
  「重建索引 20 次」那一档增量 15.5 MB 而托管堆一点没涨，那 15.5 MB 全是还没回收的垃圾。

  **两处有界性单独核，判据是「再做一遍还涨不涨」。**
  - 版本日志：写两批各 500 条（远超上限 100 条），队列封顶 **100 条**，
    托管堆 9.9 MB 对 9.9 MB，涨 **0.00 MB**；
  - 视口索引：换新的丢旧的、反复 20 次，托管堆 9.9 MB 对 9.9 MB，涨 **−0.03 MB**。
  两处都读托管堆，读之前强制回收并把大对象堆压实一次（`CompactOnce`）。
  压实那一下是必要的：不压实的话一次大分配留下的空段会一直挂着，
  同一个检查在两轮里会给出差一倍的两个数——第一版就是这样，读数在 9.9 与 25.6 MB 之间跳。

  **一个发现：5000 节点的图排不出来，而光是试着排就吃掉 96 MB。**
  大文档那一档的布局在所有级别上超时（三次运行一致）：
  `Full 超时 ~305 ms，DropAll 超时 ~155 ms，PureAuto 超时 ~155 ms`。
  原因在降级计划里——**每一级有自己的预算，而那是硬上限**
  （`levelBudget = min(remaining, entry.Budget)`），缺省计划合计 800 毫秒，
  调用方给多长的总预算都改不了它。这一档特意给了手动重排那一档（2000 毫秒），
  也就是用户点「重试」能拿到的时长：**没用，重试改的是总预算，卡住的是分级预算。**
  另外 `DropLlm` 那一级根本没试（没有模型提出的约束时它与上一级输入相同，协调器直接跳过）。

  这条发现决定了这份报告能覆盖到哪里，如实写进报告：
  - 大文档的**载入**路径量到了（IR 17.6 MB、JSON 6.0 MB、反序列化 7.6 MB）；
  - 大文档的**画出来**路径量不到（没有绘制列表，布局给不出坐标），
    所以「一份大图摆在屏幕上要占多少」只有千节点那一档的 32.7 ~ 36.9 MB，再往上**没有数，不猜**。

  还有一件值得记的：那一次注定失败的布局自己吃掉了 96 MB（峰值增量），是整个装置里最大的一笔。
  一份排不出来的图，用户看到的是「布局失败」，而进程已经为它花掉了比成功路径更多的内存。

  **门禁（全部通过）。**
  - `dotnet run --project tools/MemBudget -c Release` 退出码 0（峰值 139.1 ~ 141.5 MB，三项检查全部成立）。
  - Release 构建 0 警告 0 错误；八工程全绿；`Category=CommentDiscipline` 通过；
    `tools/McpHarness -- protocol` 8/8；`tools/LocCounter --check` 退出 0；
    `tools/LayoutScore` 退出 0；两条帧率/拖拽基准退出码 0；自检退出 0。

  **与任务清单的出入。**
  1. 多了三个开关之外的行为：退出码除了 0 / 1，多了 2（装置自己不可信——
     版本日志没封顶、或两处有界性有一处不成立）。
  2. 卡里写「载入大文档 + 1000 节点场景」，实际把大文档的**布局**也试了一遍，
     并因此拿到上面那条发现；试失败之后照常继续，不让它打断整轮测量。
  3. 卡里说「与 P5-02 共用 1000 节点场景的语料」，实际是**同一种形态、各写一份**：
     那个语料生成器在入口程序集里且是私有的，装置够不着。两份只要有一处改了尺寸或标签，
     内存数字与帧率数字就不再描述同一张图，这一条写进了报告的遗留表。
