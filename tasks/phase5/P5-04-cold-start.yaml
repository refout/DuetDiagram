id: P5-04
title: 冷启动取证
phase: 5
status: done
depends_on: [P1-03, P4-22, DuetDiagram.App]
estimated_loc: 200
files:
  create:
    - tools/StartupBench/StartupBench.csproj
    - tools/StartupBench/Program.cs
    - reports/phase5-startup.md
    - DuetDiagram.App/Services/StartupProbe.cs
  modify:
    - DuetDiagram.App/Program.cs
    - DuetDiagram.App/App.axaml.cs
    - DuetDiagram.App/MainWindow.axaml.cs
    - DuetDiagram.App/Controls/DiagramCanvas.cs
    - DuetDiagram.App/Services/DiagramSession.cs
    - tasks/README.md
    - AGENTS.md
acceptance:
  - command: dotnet run --project tools/StartupBench -c Release
    expect: 退出码 0；从进程启动到首帧可交互 ≤ 2s，逐阶段耗时（加载、反序列化、首布局、首渲染）列在报告里
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误
constraints:
  - "**量的必须是「可交互」那一段，不是「进程起来」。** 到首帧画完、能收指针输入为止；只量到 main 返回或窗口 Show 是假的快"
  - "**区分冷启动与热路径。** 重点在反序列化（P1 的 Sidecar / 快照）与首布局（P2-02）这两段，报告要能逐段追"
  - "**跨机器照实记。** 机械硬盘与固态、带不带动画的首次字体加载，差很多，报告写清测量环境"
  - "**装置不进 sln**"
context:
  - 方案 §14.3 的 Phase 5 判据「冷启动 ≤ 2s」
  - "P1-03 的序列化与 P2-02 的布局是冷启动的两个大头，这一条给它们一个独立的取证出口"
  - "界面程序的原生发布（app-and-aot 那一组）是冷启动的更真实载体，但本机缺 C++ 工具链，先走装置量"
result: |
  **结论：默认文档中位 1580.3 ms、打开一份 200 节点文档中位 1634.8 ms，
  都达到「冷启动 ≤ 2s」判据，退出码 0，余量两成。**
  装置落在 `tools/StartupBench`（不进 sln），每轮起一个**全新的界面进程**，
  量到首帧画完且窗口已上屏为止。验报告 `reports/phase5-startup.md`。

  **终点定在「首帧画完 + 窗口已上屏」，两个条件都满足才收工。**
  只量到 `main` 返回或窗口 `Show` 是假的快——前者窗口可能还没建，后者图还没画出来。
  上屏之前画的帧不算：那时窗口尺寸与内容未必是最终的，把它当终点会得到一个偏小的读数，
  而它偏小的原因跟实现快慢无关。旁证（首帧消费掉的指令条数、画布与窗口尺寸）一并写进读数文件：
  只报一个总时长的话，读的人没法判断它是「画完了」还是「空窗口上屏了」。

  **墙上时钟与界面自己的读数分开列。** 表在起进程之前开始走、看到界面的收工标记再停，
  从**进程创建**算起；界面自己的读数从它的入口算起。两者之差（约 43 ~ 49 ms）就是
  「运行时装载 + 把入口方法编译出来」那一段。合起来读的话，运行时装起来那一段会被算进界面的代码，
  而换一个发布方式（原生编译）改的恰恰是那一段。

  **逐段读数由界面自己写文件**（`DuetDiagram.App --startup-probe <路径>`，五处打点：
  `Program.Main` 入口、`DocumentLaunch.File` 之后、`OnFrameworkInitializationCompleted`、
  会话构造里首布局之后、画布首帧；窗口 `Opened` 单独记）。从外面只能看到
  「窗口出现了」这一个外部迹象，拿它当终点量到的是装置轮询的准确度，而不是界面的速度。
  窗口 `Opened` 事件在窗口的构造函数里接——放到外面接的话，事件可能在接上之前就发过了，
  而漏掉它的表现是「等首帧超时」，看起来像界面起不来，实际只是没人在听。
  探针带 30 秒兜底：界面线程若卡在一个起不来的原生调用里，装置排队等它没有意义，
  只能从后台线程收场并按「量不了」退出（退出码 2）。

  **三个场景（每轮新进程，5 轮取中位数）：**
  - 默认文档（不读文件）：中位 **1580.3 ms**（第一轮 1598.8，最小 1571.1，最大 1598.8），首帧 17 条指令；
  - 打开文档（200 节点，走读文件与反序列化）：中位 **1634.8 ms**（第一轮 1631.2，最小 1629.1，最大 1658.9），
    反序列化那一段 226.9 ms，首帧 585 条指令；
  - 打开大文档（1000 节点，观察项、只跑一轮）：**1860.6 ms**，用掉判据的 93%，不计入退出码；
    另一次独立运行量到 1905.7 ms（95%）——这一档离判据很近，逐轮波动不可忽略。

  **逐段数据（中位数那一轮）：**

  | 段 | 默认文档 | 打开文档 | 打开大文档 |
  |---|---:|---:|---:|
  | 运行时（进程创建 → 入口） | 44.7 | 45.7 | 43.7 |
  | 反序列化 | — | 226.9 | 252.3 |
  | 平台（界面框架装起来） | 385.3 | 371.2 | 367.4 |
  | 文档（工作区、文档、度量器） | 506.7 | 306.9 | 307.9 |
  | 首布局（含首份绘制列表） | 101.0 | 107.4 | 153.9 |
  | 会话（高亮、审计、命令总线接线） | 0.1 | 0.1 | 0.1 |
  | 面板（十来个面板的装配与接线） | 108.8 | 122.8 | 106.5 |
  | 画布（灌进画布并首刷） | 2.4 | 3.5 | 3.6 |
  | 上屏（窗口真的出现在屏幕上） | 381.8 | 374.1 | 376.2 |
  | 首渲染 | 47.1 | 73.8 | 246.9 |
  | 总计 | 1580.3 | 1634.8 | 1860.6 |

  判据里那四段都在表里（加载 = 运行时 + 平台 + 文档；反序列化、首布局、首渲染各是一行）。
  段比判据细，是因为「加载」把三件开销来源不同、能改的余地也不同的事装在了一起。

  **三条发现。**
  1. **最大两块不是我们的代码。** 平台初始化（367 ~ 395 ms）与窗口上屏（374 ~ 382 ms）合计约 760 ms，
     占总时长一半，且三个场景里几乎一样。一个是界面框架把自己装起来，一个是操作系统把窗口显示出来。
     想在这两段上再快，改的是换框架、换窗口创建方式，不是优化布局或绘制。
  2. **「文档」那一列在不同场景之间不可比。** 默认文档 平台 + 文档 = 893 ms；
     打开文档 平台 + 文档 + 反序列化 = 905 ms。差的 12 ms 说明同一批代码路径（尤其即时编译）
     只是被记在了不同的段里——样本文档在界面里现造，读文件那条路在入口里先反序列化好。
     要比就比总账（差 3%），或比同一场景的不同轮次。
  3. **首布局与规模弱相关，首渲染强相关。** 指令条数 17 → 585 → 2968（175 倍），
     首布局 101 → 107 → 154 ms（多 53 ms），首渲染 47 → 74 → 247 ms。
     首布局那一段主要是一次性的即时编译与首次字体度量，首渲染那一段的活儿与指令条数成正比。

  **一条与「冷」有关的如实记录：第一轮与后面几轮几乎没有差别**（1598.8 对 1571.1 ~ 1580.9，差 18 ms）。
  装置跑在刚构建好的输出目录上，那几百兆程序集早就在系统文件缓存里了。
  清空文件缓存要管理员权限，本机没做，所以表里的「第一轮」是装置自己的第一轮，
  **不是操作系统意义上的冷启动**；真冷启动会比这个大，大多少没有量。

  **门禁（全部通过）。**
  - `dotnet run --project tools/StartupBench -c Release` 退出码 0（两个计入判据的场景都在 2 秒内）。
  - Release 构建 0 警告 0 错误；八工程全绿；`Category=CommentDiscipline` 通过；
    `tools/McpHarness -- protocol` 8/8；`tools/LocCounter --check` 退出 0；
    `tools/LayoutScore` 退出 0；两条帧率/拖拽基准退出码 0；`tools/MemBudget` 退出 0；自检退出 0。

  **与任务清单的出入。**
  1. 卡里的 `files.create` 只列了装置与报告三份，实际还多了一份界面侧的打点
     `DuetDiagram.App/Services/StartupProbe.cs`，并改了界面程序集的五个文件。
     打点必须在界面那一侧：从外面只能看到「窗口出现了」，量不到逐段。
  2. 卡里说「逐阶段耗时（加载、反序列化、首布局、首渲染）」，实际切成十段
     （运行时 / 反序列化 / 平台 / 文档 / 首布局 / 会话 / 面板 / 画布 / 上屏 / 首渲染）。
     判据那四段都在，只是更细——不细的话，「加载」那 900 毫秒里哪一段能改就看不出来。
  3. 装置除了卡里要的退出码 0，还用了 1（超判据）与 2（装置自己不可信：
     界面程序没构建、收工标记没等到、界面自己报了「量不成」），与 `MemBudget`、`LayoutScore` 同口径。
  4. 多了一个观察项场景（1000 节点）。它不计入判据与退出码，
     但没有它就看不出「文档变大之后冷启动会怎样」——那是本轮唯一接近判据的读数。
  5. **「可交互」是推断出来的，没有真的合成指针事件打进去。**
     合成指针事件要造出输入参数，而那些类型在界面程序集里没有公开的构造入口。
     判据停在「窗口已上屏 + 首帧消费掉一份非空绘制列表」。要真正证「能收指针输入」，
     得在无头测试里合成事件，那一条在 `DuetDiagram.E2E.Tests` 里，不在这里。这一条写进了报告的遗留表。
  6. 量的**不是**原生编译下的启动。本机缺 C++ 工作负载（见 `reports/phase0a.md`），
     量的是框架依赖发布的那一份；原生发布没有运行时装载与即时编译，「运行时」那一段应当基本消失，
     但那是推断，不是实测，如实记成未验证。
