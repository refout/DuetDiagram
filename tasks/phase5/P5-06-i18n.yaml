id: P5-06
title: i18n 资源字符串预留与 RTL
phase: 5
status: done
depends_on: [P4-01, P4-22]
estimated_loc: 260
files:
  create:
    - DuetDiagram.App/Resources/Strings.resx
    - DuetDiagram.App/Resources/Strings.zh-CN.resx
    - docs/Internationalization.md
acceptance:
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误；所有界面硬字符串迁到资源文件，主程序不再有散落的可见中文字面量
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c Release -- --filter-trait "Category=I18n"
    expect: 全通过；切换文化后菜单与面板标题来自资源、RTL 布局不破版
constraints:
  - "**只做预留，不做完整翻译。** 方案 §13.9 写的是「i18n 预留」，不是「多语言」；这一条把字符串抽出来、留一个 zh-CN 资源，不要求把英文 etc 补齐"
  - "**RTL 只验不破版。** 阿拉伯语等从右到左的布局下，面板与画布不能错位、不能裁切"
  - "**资源键是接口。** 加一个界面字符串就加一个键，不能把整句拼出来塞进一个键，否则翻译者拿不到可翻的粒度"
context:
  - 方案 §14.3 的 Phase 5 判据「i18n 预留」与 §13.9、§二十
  - "P4-01 的菜单栏与工具栏已经把条目收进注册表，这一条把条目的可见文字从代码里抽到资源文件"
  - "P4-22 的报告里把「跨平台与跨语言没验」列为遗留，这一条是对应的收口项之一"
result: |
  **结论：`Category=I18n` 十条用例全绿，`DuetDiagram.E2E.Tests` 从 214 条涨到 224 条（失败 0），
  Release 构建 0 警告 0 错误。** 交付的是「i18n 预留」：界面文字收进资源文件、
  语言按显式代码切、换一种语言菜单与面板标题真的会变、从右到左是同一份布局绕竖中线翻过来。
  验报告 `reports/phase5-i18n.md`，做法与遗留清单 `docs/Internationalization.md`。

  **这一条最大的约束是「不变量全球化」，它把卡里的口径改掉了一半。**
  `InvariantGlobalization=true` 写在**根目录的构建属性**里，全仓生效。实测（仓外一次性探测程序，
  属性照抄）：`new CultureInfo("en-US")` 直接抛 `CultureNotFoundException`——
  「Only the invariant culture is supported in globalization-invariant mode」；`CurrentUICulture.Name` 是空串。
  三条硬推论：一、`CurrentUICulture` 驱动的**卫星程序集查找永远选不出第二语言**（具名文化建不出来）；
  二、**语言只能由显式代码指定**，卡里「切换文化后…来自资源」这句话物理上做不到；
  三、**第二个语言不能做成卫星程序集**，做成了也是死重量。
  同一个探测程序里也验过机制可行：两个 resx（一个中性、一个用 `WithCulture=false` + `LogicalName`
  嵌进主程序集）在 `InvariantGlobalization=true` + `IsAotCompatible` + 裁剪分析器下都取得到，**0 警告**；
  第二语言里没有的键返回空，回落由门面自己写。

  **档的标识与档名拆开了，这是这一条真正的工程点。** `MenuGroups` 上的常量原来是**同时**当身份与
  显示文字用的（`"编辑"` 这两个字）：注册表按它分组（`On(surface, group)` 按序号比较），
  三个 E2E 用例也拿它当身份。把显示出来的字当身份用的话，**换一种语言就找不到自己了**——
  中文下 `On(MenuSurface.Menu, "Edit")` 会返回空，而那种空看起来像「这一档没有条目」。
  现在是 `MenuGroups.Edit`（标识，`"edit"`）与 `MenuGroups.Display(id)`（档名，按语言取）两样；
  条目同理：`Id`/`Group` 是标识、`LabelKey` 是资源键、`Label` 是按语言取出来的字。

  **资源键是接口。** 一处文字一个属性、一个属性一个键；带占位符的走格式串
  （`menu.shortcut` = `{0}（{1}）`、`menu.entry-name` = `{0}：{1}`），条目不能点时的理由也是
  **整句一个键**——原来 `MenuRefusals.NoSelection(context, "要删的元素")` 那种"传一个宾语进来拼"
  的写法改掉了：在调用处拼的话，换一种语序就拼不成句子了，而语序正是翻译要改的东西。
  缺的键回落中性资源；两边都没有**直接抛**而不是返回键名——键名会原样显示在界面上，
  而"界面里出现一串英文键"看起来像界面坏了，实际是漏了一条资源。

  **标记里用 `{x:Static res:Strings.Xxx}`，实测是构建期解析。** 把一个成员名写错，报的是
  `AVLN2000: Unable to resolve ... as static field, property, constant or enum value`，**构建失败**。
  这一条重要：本仓开着原生编译与裁剪分析器，运行期反射的用法在真原生发布下会出问题，
  而本机缺 C++ 工具链跑不了真原生发布，所以"编译期展开"只能靠"写错就编译不过"旁证。

  **RTL 验的是"镜像之后逐块对得上"**：尺寸不变、位置正好是绕窗口竖中线翻过来的、
  本来就放得下的翻过来也放得下。判据**不是**"每块都在客户区里"——900 × 600 的客户区里
  左栏五块面板本来就装不下（底边分别落在 298 / 603 / 725 / 725 / 894），
  而那种溢出左右两个方向一模一样，与方向无关。

  **第一次量 RTL 量错了，记下来。** 量出来的是"图层面板跑到 900, 70，宽 240，越出客户区"，
  看着像 RTL 破版。实际是量法错了：从右到左不是把每个控件挪个位置，而是给整棵树挂一层镜像，
  镜像之下左上角量出来的那个点已经跑到框的右边去了，再往右加一个宽度得到的是一个真实位置上
  不存在的框。改成量两个角、自己归一化之后，图层面板落在 660, 70——正好是 0, 70 绕竖中线翻过来的。
  顺带一条：`Rect(Point, Point)` 那个重载**不做归一化**，两个角给反了会得到宽度为负的矩形，
  而负宽度看着像"尺寸变了"。

  **门禁（全部通过）。**
  - `Category=I18n` 10 / 0 / 10；`DuetDiagram.E2E.Tests` 整组 224 / 0 / 224（原 214）。
  - Release 构建 0 警告 0 错误；八工程全绿；`Category=CommentDiscipline` 通过；
    `tools/LocCounter --check` 退出 0。

  **与任务清单的出入。**
  1. 卡里的 `Strings.zh-CN.resx` 换成了 `Strings.en.resx`（见上面第一条推论：不变量全球化下
     zh-CN 卫星永远选不出来，是死重量）。中性 `Strings.resx` 装中文，第二个语言嵌主程序集、
     按显式代码选。它的作用是**证明取文字这条路真的通**——只看一种语言时，
     "来自资源"与"硬编码"分不开。
  2. 卡里的验收写"切换文化后…"，实际做的是切语言代码。这是与卡片口径的一处**实质**差别，
     不是偷懒：`CultureInfo` 在本仓建不出具名文化。
  3. **"所有界面硬字符串迁到资源"只做到一部分。** 卡里 `estimated_loc: 260`，而
     `DuetDiagram.App` 里带中文的字符串字面量有 1125 处（去掉异常消息 936 处，
     再去掉装置与命令行输出 778 处）。260 行覆盖不了 778 处，所以按仓里已有的
     "收窄 + 记下理由"先例收窄：机制、菜单这一条链、各面板静态标题、门禁、文档。
     实际迁了 75 条键（档名 7、条目 25、拒绝理由 13、两处格式串 2、面板标题与空提示 8、
     画布空提示 1、就地编辑器 4、变更边栏 4、导入对话框 2、布局失败对话框 4、
     人工调整恢复对话框 4、诊断面板关闭 1）。其余约 700 处逐类列在
     `docs/Internationalization.md` 的遗留表里，并给出搬运的做法。
  4. `docs/Internationalization.md` 是卡里没列的新增（卡里只列了两个 resx）。
     机制与边界不写下来，下一个人加一条文字时会把键拼错、或者又写回硬编码。
  5. **多了一条源码扫描门禁**（两条用例），卡里没有。文字来自资源这件事只有靠扫描才拦得住回退：
     新加一条条目时忘了写键，屏幕上照样有字，而它不会跟着语言变。
     扫描跳过注释与异常消息——注释给改代码的人看，异常消息只给开发者看，界面上不会出现。
  6. **可访问名称这一层没迁**（标记里 8 处 + 代码里 50 处）。只迁标记那一半会让这一层半新半旧，
     索性一起留着，与其余未迁项同一条口径；标记扫描那一条因此放行
     `AutomationProperties.Name` / `AutomationProperties.HelpText` 两个属性。
  7. **判据不是"每块面板都在客户区里"**，而是"镜像之后逐块对得上"，原因见上面那条。
  8. 英文那 74 条是按词义直译的，**没有经过母语者校对**；它自己也不是交付物，
     只用来证明这条路通。报告里如实记了这一条。
