id: P5-07
title: Phase 5 收尾——六条判据与真人验收
phase: 5
status: done
depends_on: [P5-01, P5-02, P5-03, P5-04, P5-05, P5-06]
estimated_loc: 300
files:
  create:
    - reports/phase5.md
  modify:
    - AGENTS.md
    - tasks/README.md
    - reports/loc.md
acceptance:
  - command: dotnet test --project tools/LayoutScore -c Release
    expect: 退出码 0；布局评分 ≥ 85
  - command: dotnet run --project DuetDiagram.App -c Release --no-build -- --benchmark-frames --nodes 1000 --frames 120
    expect: 帧率 ≥ 30 FPS 且剔除率 > 80%
  - command: dotnet run --project tools/MemBudget -c Release
    expect: 退出码 0；峰值工作集 < 500MB
  - command: dotnet run --project tools/StartupBench -c Release
    expect: 退出码 0；冷启动 ≤ 2s
  - command: dotnet test --project DuetDiagram.E2E.Tests/DuetDiagram.E2E.Tests.csproj -c Release -- --filter-trait "Category=Accessibility"
    expect: 全通过；WCAG AA 的底座（键盘可达 + 可访问名称）齐备
  - command: dotnet build DuetDiagram.slnx -c Release
    expect: 0 警告 0 错误；i18n 资源字符串预留完成
  - command: dotnet run --project tools/LocCounter -c Release -- --root "$PWD" --check
    expect: 退出码 0；reports/loc.md 与代码一致
constraints:
  - "**六条判据逐条指向证据，不许只写「已通过」。** 布局评分、1000 节点流畅、内存、冷启动、WCAG AA、i18n 各自由哪个装置或哪份报告验的，写清楚"
  - "**能机验的与要人验的分开列。** 评分/帧率/内存/启动/键盘这些装置能判；对比度与读屏实际体验要真人，记成「未验」而不是「通过」"
  - "**跨机器与跨平台没做的那几条要如实列。** 原生发布的冷启动与内存只有带 C++ 工具链的运行器才真量过；RTL 与读屏只验了不破版，没验真人能读顺"
  - "**CI 要把 Phase 5 新增的门禁补上。** 布局评分、内存、冷启动、无障碍、i18n 这些装置各自退化时不会让别的测试变红，要单列成步骤"
  - "**报告里要写明哪几条只有自建用例、没有真人用过。** 与 P4-22 同一条口径"
context:
  - 方案 §14.3 的 Phase 5 六条判据与 §13.9 的打磨范围
  - "这一条与 P4-22 同一条职责：核的是六条判据在这套实现上到底有没有出口，没有出口的那条如实记成「没出口」"
  - "reports/phase4.md 是它的直接先例（逐条判据 + 谁验的 + 遗留那份格式）"
result: |
  **结论：六条判据各有一条出口，逐条指向证据、能机验的与要人验的分开列、没做的如实列。
  验报告 `reports/phase5.md`。Phase 5 的七个任务全部 `done`。**

  **六条判据的结论（本次全部重跑，退出码都是 0）：**

  | # | 判据 | 装置能判到哪一步 | 实测 | 报告 |
  |---|---|---|---|---|
  | 1 | 布局评分 ≥ 85 | 能，全判 | 综合分 **96.6**（简单平均 95.7、最低 91.8） | `reports/phase5-layout-score.md` |
  | 2 | 1000 节点流畅 | 能，全判 | 虚拟化 **137.3 帧每秒**、剔除 **86.3%**、拖拽中位 **0.290 ms** | `reports/phase5-fluency.md` |
  | 3 | 内存 < 500MB | 能，全判 | 峰值工作集 **146.4 MB**（余量 3.4 倍） | `reports/phase5-memory.md` |
  | 4 | 冷启动 ≤ 2s | 能，全判 | 默认文档中位 **1587.3 ms**、200 节点中位 **1635.0 ms** | `reports/phase5-startup.md` |
  | 5 | WCAG AA | **只能判一半** | 名字 + 键盘齐备；对比度、读屏、焦点可见性**未验** | `reports/phase5-accessibility.md` |
  | 6 | i18n 预留 | **只做到一部分** | 机制 + 75 条键落地；其余约 700 处未迁 | `reports/phase5-i18n.md` |

  **四条是装置能量，另外两条各缺一块。**
  **「WCAG AA」装置只能判一半**：它含三件不同的事，只有前两件能机验（每个控件有没有名字、
  键盘到不到得了），第三件（对比度够不够 4.5:1 / 3:1、读屏软件念出来顺不顺、焦点框看不看得见）
  要取最终渲染出来的颜色、要真人戴上读屏走一遍，**未验**，不写成通过。
  **「i18n 预留」只做到一部分**：机制与 75 条键落地，其余约 700 处未迁，逐类列在
  `docs/Internationalization.md` 的遗留表里。

  **能机验的与要人验的分开列**（报告里一张表，右栏是"要人验"）：
  布局评分 → 这个分**符不符合人看着的好看**（与人工评分的对照没做）；
  帧率 → 人眼看不看得出卡；内存 → 长会话下的手感；冷启动 → 体感与原生发布那一档；
  无障碍 → **对比度、读屏体验、焦点可见性**；i18n → 译文有没有母语者校对、别的语言下排版好不好看。

  **只有自建用例、没有真人用过。** 六条判据目前**全部**是自建装置与用例验的：
  没有人用读屏软件走过界面、没有人肉眼核过对比度、没有人真的双击图标计过启动时间、
  没有人连续用几个小时看过内存、没有人用英文界面干过活、没有人用从右到左的语言看过排版、
  没有人评价过排出来的图好不好看。这与 P1-14 / P2-13 / P3-16 / P4-22 同一类：
  **装置齐了不等于测过了**——报告里六条判据的"通过"都该读成"装置验过了"，不是"人验过了"。

  **跨机器与跨平台没做的（如实列，报告里五条）：**
  一、**原生发布只在带 C++ 工具链的机器上验过**——本机缺 MSVC C++ 工作负载，
  所以冷启动与内存量的都是**框架依赖**发布那一份，原生发布下"运行时"那一段应当基本消失，
  但那是推断不是实测；i18n 里"`x:Static` 是构建期解析"也靠"写错成员名就编译不过"旁证。
  二、**所有界面读数都在 Windows 上量的**，Linux / macOS 上没人起过窗口。
  三、**CI 上两条装置放在 ubuntu 那一组**（布局评分、内存预算——它们只引核心/布局/渲染，不起窗口），
  要窗口的（帧率、拖拽、冷启动、无障碍、i18n）放 Windows 那一组；
  **ubuntu 上跑出来是什么数没有验过**。
  四、**性能与内存只在这一台机器上量过**（无独显的软件光栅化）。
  五、`reports/phase2-drag.md` 那条 11.321 ms **复现不出来**（同提交同机器量到 0.310 ms），
  按"不改正文数字、加一行指向新报告"处理，但**为什么复现不出来没有查明**。

  **CI 补了四条 Phase 5 门禁**（各带一句"退化了会怎样"的理由）：
  布局质量评分与内存预算进 `build-and-test`（ubuntu），千节点帧率与冷启动进 `app-and-aot`（Windows）。
  无障碍与 i18n 两条在 P5-05 / P5-06 里已经加过。

  **门禁（全部通过）。** `tools/LayoutScore` 退出 0；`--benchmark-frames` 与 `--benchmark-drag`
  退出 0；`tools/MemBudget` 退出 0；`tools/StartupBench` 退出 0；`Category=Accessibility` 10/0/10；
  Release 构建 0 警告 0 错误；`tools/LocCounter --check` 退出 0；八工程全绿；
  `Category=CommentDiscipline` 与 `Category=MultiAgent` 通过；`tools/McpHarness -- protocol` 8/8；
  自检退出 0。

  **与任务清单的出入。**
  1. 卡里第一条验收写 `dotnet test --project tools/LayoutScore -c Release` —— **`tools/LayoutScore`
     不是测试工程，是装置**（`Exe`，不进 sln），没有 `dotnet test` 这一说，实际是
     `dotnet run --project tools/LayoutScore -c Release`。卡里其余几条装置命令的写法是对的。
  2. 卡里 `files.modify` 列了 `reports/loc.md`，但 LOC 报告是 `tools/LocCounter` 生成的产物，
     这一条没有手改它，只重跑了一次确认与代码一致。
  3. 卡里没有列 `.github/workflows/ci.yml`，但约束里要求"CI 要把 Phase 5 新增的门禁补上"——
     补门禁只能改那个文件。这一条动了它。
  4. 报告里多了一节「能机验的与要人验的」（卡里只要求"分开列"），因为六条判据里
     每一条都有"装置判不到的那一半"，一张表比散在正文里更容易看出还欠什么。
  5. **报告没有把任何一条写成"通过"就算完**：带环的图排不出来、5000 节点的图排不出来、
     冷启动不是真冷启动也不是原生发布、与人工评分的对照没做、界面导出对话框仍是占位——
     这些都单列在「遗留」一节里，与 P4-22 同一口径。
