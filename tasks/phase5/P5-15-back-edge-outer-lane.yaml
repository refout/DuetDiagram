constraints:
  - "**只有本来就会压到节点的回边才改道。** 触发条件是「回边 + 当前折线确实穿过节点」，所以十份无环图的折线一个点都不动——这是「作用范围只有回边」的一手证据"
  - "**判断哪条边是回边必须带上主方向的正负，不能只看几何上的上下左右。** 只把 `ranksAreVertical` 传进去会丢掉正负号，而自下而上与自右而左这两个方向在菜单里是真实可选的——`BT` 下顺着层序走的边几何上恰恰就是「终点在上」那一批，拿几何判据当回边会把正向边全判成回边"
  - "**绕行通道要罩进报告的范围。** 那个范围往下就是绘制列表的尺寸，再往下是画布滚动区与导出的画布大小；罩不住的那一截会被裁掉。这一条不能只改路由不改范围"
  - "**候选通道先试不撑大外接框的那一侧。** 报告的范围以原点为基准，最外那个节点与原点之间留着一截空当，通道落在那里不撑大范围；对侧的通道一定在最外缘之外，会把范围撑大，而范围是评分的一个维度"
  - "**两侧都走不通就退回原折线并如实计入穿越。** 不假装绕开：一条看着能绕开、实际还是压过去的折线，比一条明确报冲突的更难排查"
  - "**判据要验过「把钩子摘掉它就红」。** 摘掉之后 `Category=Layout` 只红新增的那 2 条，其余 39 条一条不动"
  - "**指定了端口的边不改道。** 端口是用户选的出入口，把线改到侧边等于覆盖用户的选择"
  - "**只动路由这一处与报告范围那一处。** 断环、层序、让位、收缩、对齐这些步骤一个字都不改"
  - "**同一侧的多条回边会挤在同一条通道上，如实记下、不假装解决。** 真正的多通道布线仍是后续工作"
context:
  - "这一条是 P5-14 留下的尾巴：P5-14 让带环的图排得出来，但回边从最低层回到最高层时走的是层间那条直上直下的通道，会压过中间那几层的节点（`cycle-4` 穿节点 1/4，方向一致 75.0、紧凑度 50.6 也由它造成，单图 77.6 低于 85 的门槛）"
  - "方案 `docs/Layout-Constraints.md` 把这件事定性为「让纵向段也走列间空隙」的完整多通道布线算法，并记为后续工作；本轮做的是其中**最外侧那一条空隙**，内部列间空隙的多通道布线仍然留着"
  - "本仓自己的 DSL 语法文档里那份带重试回边的完整示例同样走这条路（`Category=Open` 那一条），改完仍然全绿"
result: |
  **结论：回边不再压到中间层的节点了。** `cycle-4` 的穿节点从 `1/4` 降到 `0/4`，
  交叉 75.0 → 100.0，单图综合 **77.6 → 85.1**（方向一致仍是 75.0，那是四节点环的形状，
  不是缺陷）；语料综合分 95.9 → **96.2**，退出码 0，**十一份里第一次没有哪一份低于阈值**。

  **改法：路由那一层加一种新走法。** 回边逆着层序走，两条竖段必然跨过中间那些层，
  于是压在中间层的节点上；层间空隙是横向的，跨过去的那两段是纵向的，空隙里根本没有
  能绕开所有中间层节点的通道。所以改成走节点列**外侧**的一条通道：从源节点侧边的中点出去，
  沿整张图之外的一条竖线跨过所有层，再从目标节点侧边进去。
  通道坐标取整张图的四边再往外让开 16，不是按两端节点算的——竖段要跨过中间所有层，
  只有整张图的边才保证不碰到任何一层的节点。

  **判断回边要带主方向的正负。** 路由原来只拿到「层是不是纵向排列」这一个布尔值，
  而 `BT` 与 `RL` 两个方向在菜单里是真实可选的，它们的主方向正负与 `TB`/`LR` 相反——
  只看几何会把 `BT` 下所有正向边都当成回边。所以入参换成主方向本身，
  由它同时算出排列轴向与前进方向。

  **先试不撑大外接框的那一侧。** 报告的范围以原点为基准，而最外那个节点与原点之间
  留着一截空当，通道落在那里不撑大范围；对侧的通道一定在最外缘之外，会把范围撑大，
  而范围是评分的一个维度。所以先试左（层上下叠放时）或上（层左右并排时），再试对侧。
  两侧都走不通就退回原折线并如实计入穿越——不假装绕开。

  **报告的范围也跟着改了。** 原来只取节点外缘，现在把折线点也并进去。理由是那个范围
  往下就是绘制列表的尺寸，再往下是画布滚动区与导出的画布大小——罩不住的那一截会被裁掉。
  对语料十一份是恒等变换（无端口的折线本来就落在节点框内）。

  **对无环图零影响，这是量出来的。** 十份无环图的四个维度分数与综合分与修前**一字不差**
  （chain-8 93.0、layered-4x3 96.9、layered-3x4 96.9、layered-6x5 98.1、diamond 95.5、
  fork-6 97.5、tree-3 97.0、fan-12 97.7、k33 91.8、same-rank 92.4）。触发条件本来就要求
  「回边 + 确实穿过节点」，无环图两者都不满足。

  **`cycle-4` 修后的样子**（`--dump` 读数）：节点坐标与修前逐字相同（c0 在 x=70、c1/c2 在 x=40、
  c3 在 x=70），**外接框仍是 150.0×390.0**（左通道落在空当里，没撑大范围），
  回边 `c3->c0` 的折线从 `(70,370) -> (110,?) -> ...` 变成
  `(70,370) -> (24,370) -> (24,40) -> (70,40)`——从 c3 左边出去、沿 x=24 上到 c0 那一层、
  再从左边进去。

  **判据**：`Category=Layout` 41 条（P5-14 的 39 条 + 新增 2 条：
  纵向布局的回边绕行、横向布局的回边绕行），`Category=Open` 10 条，整份解决方案 2031 条。
  两条新用例钉的都是**机制**而不是「恰好没压上」：折线里必须出现一个比所有节点都靠左
  （横向时靠上）的点，否则中间层恰好没占住那个位置也能过，那不算修好。

  **「把钩子摘掉它就红」验过**：摘掉之后 `Category=Layout` 41 条里红 2 条，
  正是新增的那两条，其余 39 条一条不动；装回去即全绿。

  **横向那一条为什么用 80×80 的节点。** 层左右并排时引擎会把同一行里的节点错开半个行高；
  行矮的时候（语料那种 80×40）回边那条横线恰好擦着中间行的下边界，按判据不算穿过，
  所以那条路根本不会被触发。节点高到 80 才会真的压进去。语料里的横向图全是无环的，
  这一条是横向那一支唯一的覆盖。

  **门禁读数**：本机 Release 构建 0 警告 0 错误；`Category=Layout` 41/41、
  `Category=Open` 10/10、整份解决方案 2031/2031；`tools/LayoutScore` 退出码 0。
  取证与推理见 `reports/phase5-layout-score.md` 的第九节。

  **没验的：** 同一侧有多条回边时它们会挤在同一条通道上重合——边与边重合不计入评分，
  也不属于硬保证，但看着不好；真正的多通道布线仍是后续工作。
  组合框在渲染时还会往外加留白与标题（那部分不在布局算出的包围盒里），
  外侧通道可能擦到它，属观感问题。
