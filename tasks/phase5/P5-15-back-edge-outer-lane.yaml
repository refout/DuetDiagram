  - command: dotnet run --project tools/LayoutScore -c Release
    expect: 退出码 0，综合分 96.2（阈值 85）；cycle-4 穿节点 1/4 → 0/4、综合 77.6 → 85.1；十一份里没有一份低于阈值
  - command: dotnet run --project tools/LayoutScore -c Release -- --dump cycle-4
    expect: 外接框仍是 150.0×390.0、节点坐标不变，回边 c3->c0 的折线出现一个 x=24 的点（在 40 之外）
  - command: dotnet test --project DuetDiagram.Layout.Tests -c Release -- --filter-trait "Category=Layout"
