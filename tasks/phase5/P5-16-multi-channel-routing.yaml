constraints:
  - "**绕行按垂直于主方向的一整组空当挑，不再只有最外侧那一条。** 空当是每个节点在垂直于主方向那条轴上的投影区间的补集；它天然包含最左边那条带、各列之间的空当与最右边那条带。列没对齐时空当会被并掉，只剩最外侧那两条，退化成 P5-15 那种走法，不会算错"
  - "**同侧的多条边各占一条通道。** 一条通道给一条边用掉之后后面的边跳过它。占用按整条通道记，不按主轴区间——后者要多判一层区间重叠，代价与不确定性都更高"
  - "**触发条件从「回边」换成「折线的主方向那一段穿过节点」。** 锚点把节点拉到别的层时，连到它的正向边同样跨过中间几层，回边只是它的一个特例。判据换成直接量之后不必再判主方向的正负"
  - "**判据收在「主方向那一段」上。** 绕行只修得好主方向那一段的穿越；落在层间那条横段上的穿越是挑不到空档时的如实计数，不该被一条绕到图外的远路顶掉。有一条用例钉着这个分界"
  - "**端点解析成组合的边不试。** 组合的成员节点在网格里，而排除的只是组合自己那个标识，于是这条边与自己的成员相交也会被算成压节点——判据在这里不可信"
  - "**每条候选都真查一遍。** 空当只保证主方向那一段干净，两端横着出去的腿不保证——同层里挨着的邻居会挡在中间。查不过就试下一条，单条边最多试 32 条候选"
  - "**都不成就退回原折线并如实计入穿越。** 不假装绕开。正向边绕行是尽力而为而不是保证：端点在某列中间时两条横腿会压到同层邻居，那条边就退回原折线"
  - "**没压到节点的边不多查一遍。** 穿越判定先算一次，绝大多数边到此为止；主方向那一段的判定只在确实压到节点时才跑。折线重算是补齐逻辑里最重的一步，不能白白翻倍"
  - "**P5-15 的读数逐字不动。** 触发条件换了、通道从一条变成一组，但 `cycle-4` 的穿越仍发生在竖段上、左边那条带里第一条通道仍是 `40 - 16 = 24`，所以连通道坐标都没换；十份无环图穿节点本来就是 0，一次都不触发"
  - "**只动路由这一处。** 断环、层序、让位、收缩、次序、对齐、报告范围这些一个字都不改"
  - "**判据要验过「把钩子摘掉它就红」。** 摘掉之后 `Category=Layout` 44 条里红 4 条：P5-15 那两条与新增的 2 条；护栏那一条与其余 40 条一条不动"
context:
  - "这一条是 P5-15 留下的两条尾巴：同一侧的多条回边挤在同一条通道上重合；以及方案里说的「让纵向段也走列间空隙」的完整多通道布线。P5-15 做的是其中**最外侧那一条空隙**"
  - "第二条尾巴是 `docs/Layout-Constraints.md` 里「一个已知的、可解释的穿越」记的那个情形：用例把某一层的节点钉到别的层的带上，于是连到它的边必须跨过中间几层。P5-15 的补记说那是锚点语义的后果、不在范围内——本轮把它做掉"
  - "触发条件收在「主方向那一段」上，是因为 `docs/Layout-Constraints.md` 里那句「空隙被占满时退回中点并计入穿过节点的计数，不假装绕开」说的是层间横段上的穿越；两种情形各走各的路"
result: |
  **结论：绕行从「节点列外侧那一条通道」变成「垂直于主方向的一整组空当」。**
  同侧的多条边各占一条通道、不再叠在一起；锚点把节点拉到别的层、连到它的**正向边**
  跨过中间几层时也走同一条路。**语料的读数与 `--dump cycle-4` 一个都没动。**

  **语料读数（与 P5-15 逐字相同）**：综合分 **96.2**（简单平均 94.7、最低 85.1），退出码 0，
  十一份逐图分数一字不差；`--dump cycle-4` 外接框 150.0×390.0、节点坐标不变，
  回边 `c3->c0` 仍是 `(70,370) -> (24,370) -> (24,40) -> (70,40)`。

  **为什么一个都没动。** 十份无环图的穿节点本来就是 0，一次都不触发；`cycle-4` 的回边穿越
  发生在竖段上（`x=110` 压进 `c1`/`c2` 的 `[40,120]`），左边那条带里第一条通道仍是
  `40 - 16 = 24`，所以它连通道坐标都没换。

  **改法。** 空当表：把每个节点在垂直于主方向那条轴上的投影区间并起来、取补集，
  得到一段段不含任何节点的区间——补集天然包含最左边那条带、各列之间的空当、最右边那条带。
  这张表**懒算**，没有边要绕行时一次都不建。候选：按空当从左到右扫，每段里第一条通道
  贴着离两端最近的那条边缘、再按 8 往外排，最多 4 条；两端各自从最近的那一侧出去
  （通道夹在端点的横向区间里则这条候选不成立——腿会从节点身子里出来）。每条候选都真查一遍，
  单条边最多试 32 条候选。都不成就退回原折线并如实计入穿越。

  **量出来的两条读数**（用例里）：两条回边各占一条通道——`e3` 走 `x=24`、`chord` 走 `x=16`
  （改前两条都在 `x=24` 上从头叠到尾）；锚点跨层——改前 `n3-1 -> n4-1` 是
  `(200,60) -> (200,370) -> (200,460)` 一条直着压过 `n1-1` 与 `n2-1` 的竖线（穿节点 2），
  改后是 `(160,40) -> (136,40) -> (136,480) -> (160,480)`，竖段落在 `x∈(120,160)`
  那条列间空当里，穿节点 0。

  **两条顺带的改动。** 一、触发条件从「回边 **且** 穿过节点」换成「折线的主方向那一段
  穿过节点」——绕行只修得好这一段，落在层间横段上的穿越仍然如实计数（有一条护栏用例钉着
  这个分界）；判据换成直接量之后也不必再判主方向的正负。二、端点解析成组合的边不试——
  组合的成员节点在网格里，这条边与自己的成员相交也会被算成压节点，判据在那里不可信
  （放开这条限制时 `An_edge_between_two_subgraphs_is_routed_onto_their_outlines` 会被
  绕到盒子侧边去）。

  **没压到节点的边不多查一遍。** 穿越判定先算一次，绝大多数边到此为止；主方向那一段的
  判定只在确实压到节点时才跑。千节点图上折线重算的读数与改前落在同一个带里
  （本机四次基线：最小 1.2 / 2.4 / 2.9 / 4.7 ms、中位 3.3 / 4.0 / 6.8 / 12.6 ms；
  改后一次：最小 2.8 ms、中位 5.9 ms——机器噪声大到分辨不出差异）。

  **判据**：`Category=Layout` 44 条（新增 3 条通道用例 + 给 P5-15 那条补了一条
  「通道坐标正好是 `leftEdge - 16`」的断言），`Category=Open` 10 条，整份解决方案 2034 条；
  Release 构建 0 警告 0 错误。**摘掉绕行钩子之后 `Category=Layout` 红 4 条**——
  P5-15 那两条与新增的 2 条，护栏那一条与其余 40 条一条不动。

  **没解决的：** 最左边那条带放得下几条通道由最左那个节点离原点多远决定（语料那种 80 宽的
  节点只放得下三四条），再多就得溢到列间空当或右边那条带，后者会撑大引擎报告的范围
  （评分里的紧凑度只算节点，分数不掉，但画布会变大）；端点在某列中间时两条横腿会压到
  同层邻居，那条边退回原折线并如实计数——**尽力而为，不是保证**。
  组合框在渲染时还会往外加留白与标题（那部分不在布局算出的包围盒里），通道可能擦到它，
  属观感问题。
